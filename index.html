<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geo Quizz</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#111827;--mute:#6b7280;--acc:#2563eb;--onacc:#fff;--ok:#16a34a;--bad:#dc2626;--line:#e5e7eb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#161a22;--ink:#e8eaed;--mute:#8b93a1;--acc:#4c8bf5;--onacc:#0b1220;--ok:#2fb36a;--bad:#e5534b;--line:#262c38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#161a22;--ink:#e8eaed;--mute:#8b93a1;--acc:#4c8bf5;--onacc:#0b1220;--ok:#2fb36a;--bad:#e5534b;--line:#262c38;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
main{max-width:480px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.9rem;line-height:1.15;margin:4px 0 6px;font-weight:700;letter-spacing:-.02em}
h1 span{color:var(--acc)}
.sub{color:var(--mute);margin:0 0 22px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
label{font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);display:block;margin-bottom:10px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvb{padding:11px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:500;font-size:.92rem;transition:.15s}
.lvb small{display:block;font-weight:400;color:#f59e0b;font-size:.75rem;margin-top:2px}
.lvb.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card));color:var(--acc);font-weight:600}.lvb.on small{color:#f59e0b}
.btn{width:100%;padding:14px;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:var(--onacc);font-weight:600;font-size:1rem;margin-top:10px;transition:.15s}
.btn.alt{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn:active{filter:brightness(.92)}
.btn[disabled]{opacity:.45}
.nav{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.nt{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}.nav svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav span{flex:1}.nav b{display:block;font-weight:600;font-size:1.05rem}.nav small{color:var(--mute);font-size:.82rem}
.nav i{color:var(--mute);font-style:normal;font-size:1.4rem}
.nav:active{background:var(--bg)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:500;margin-bottom:10px;font-size:.92rem}
.top b{font-weight:700}
.bar{height:6px;border-radius:6px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .1s linear}
.flag{font-size:7rem;line-height:1.15;text-align:center;padding:22px 0;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:14px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:500;font-size:.98rem;min-height:58px;box-shadow:0 1px 2px rgba(16,24,40,.05);transition:.15s}
.opt.fl{font-size:3.2rem;line-height:1.2;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no{background:var(--bad);border-color:var(--bad);color:#fff}
.pl{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border:0}.pl b{font-weight:700}.pl .me{color:var(--acc);font-weight:600}
.big{font-size:3.6rem;font-weight:700;text-align:center;line-height:1;color:var(--acc);letter-spacing:-.03em}
.mute{color:var(--mute);font-size:.9rem;text-align:center}
.err{color:var(--bad);font-weight:600;text-align:center;margin:8px 0}
.lvb.md{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px}
.mi{display:inline-flex;align-items:center;gap:1px;padding:7px 8px;border-radius:11px;flex:none;box-shadow:0 2px 6px -2px rgba(0,0,0,.35)}
.mi svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb{display:flex;justify-content:flex-end;margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:3px}
.seg button{width:36px;height:30px;border:0;background:transparent;border-radius:999px;display:grid;place-items:center;color:var(--mute)}
.seg button.on{background:var(--acc);color:var(--onacc)}
.seg svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lvl{display:flex;flex-direction:column;gap:8px}
.lr{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);transition:.15s}
.lr.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--card))}
.bars{display:flex;align-items:flex-end;gap:3px;height:22px;flex:none}
.bars i{width:5px;border-radius:2px;background:var(--line)}
.bars i:nth-child(1){height:7px}.bars i:nth-child(2){height:12px}.bars i:nth-child(3){height:17px}.bars i:nth-child(4){height:22px}
.lt{flex:1}.lt b{display:block;font-weight:600}.lt small{color:var(--mute);font-size:.8rem}
.cf{font-weight:700;font-size:.82rem;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.lr.on .cf{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
input{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
.lk{border:0;background:none;color:var(--acc);font:inherit;padding:0;text-decoration:underline}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.fx i{position:absolute;top:-24px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .6s ease-out}
.badge{display:table;margin:0 auto 12px;padding:5px 14px;border-radius:999px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;font-weight:700;font-size:.8rem;letter-spacing:.04em;animation:pop .5s .15s both}
@media (prefers-reduced-motion:reduce){.pop,.badge{animation:none}}
</style></head>
<body><main id="app"></main>
<script>

const C=RAW.split(",").map(s=>{const[c,n,t]=s.split(":");return{c,n,t:+t}});

const MODES={flag:"Pays d’un drapeau",pf:"Drapeau d’un pays",cap:"Capitale d’un pays",cp:"Pays d’une capitale",all:"Général · tous les jeux"},SEC={d:["flag","pf"],c:["cap","cp"]},IC={flag:"🎌➜🌍",pf:"🌍➜🎌",cap:"🌍➜🏙️",cp:"🏙️➜🌍"};
const G={flag:["flag","globe","#2563eb","#7c3aed"],pf:["globe","flag","#7c3aed","#db2777"],cap:["globe","city","#f59e0b","#ef4444"],cp:["city","globe","#0d9488","#2563eb"]};
const P={flag:'<path d="M5 21V4"/><path d="M5 4h13l-2.5 4.5L18 13H5"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',city:'<path d="M3 21h18M5 21V11m4 10V11m6 10V11m4 10V11M2.5 11 12 4l9.5 7z"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>'};
const sv=p=>`<svg viewBox="0 0 24 24">${P[p]}</svg>`;
const MI=k=>{if(k==="all")return `<span class="mi" style="background:linear-gradient(135deg,#10b981,#059669)">${sv("trophy")}</span>`;const[a,b,c1,c2]=G[k];return `<span class="mi" style="background:linear-gradient(135deg,${c1},${c2})">${sv(a)}${sv("arrow")}${sv(b)}</span>`};
const modeButtons=(ks=["flag","pf","cap","cp"],cur=S.mode)=>`<div class="lv" style="grid-template-columns:1fr">${ks.map(k=>`<button class="lvb md ${cur===k?"on":""}" data-md="${k}">${MI(k)}<span>${MODES[k]}</span></button>`).join("")}</div>`;
function applyTheme(t){const e=document.documentElement;if(t==="light"||t==="dark")e.dataset.theme=t;else delete e.dataset.theme;S.theme=t}
const themeCtl=()=>`<div class="seg" role="group" aria-label="Apparence">${[["auto","Auto"],["light","Clair"],["dark","Sombre"]].map(([k,l])=>`<button class="${S.theme===k?"on":""}" data-th="${k}" title="${l}" aria-label="${l}">${sv(k==="light"?"sun":k==="dark"?"moon":"auto")}</button>`).join("")}</div>`;
const bindTheme=()=>app.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{applyTheme(b.dataset.th);try{localStorage.setItem("gq-theme",b.dataset.th)}catch(e){}home()});
const flag=c=>[...c].map(x=>String.fromCodePoint(127397+x.charCodeAt(0))).join("");
const LV={1:{n:"Facile",h:"Pays connus · 4 choix · 10 s",pool:1,ch:4,time:10,coef:1},2:{n:"Moyen",h:"Plus large · 4 choix · 10 s",pool:2,ch:4,time:10,coef:2},3:{n:"Difficile",h:"Choix proches · 6 choix · 10 s",pool:3,ch:6,time:10,coef:3},4:{n:"Très difficile",h:"Choix très proches · 8 choix · 10 s",pool:3,ch:8,time:10,coef:5}};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuf=(arr,r)=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const FG="FR NL RU LU HR RS SK SI CZ|IT IE MX CI HU BG|RO TD AM BE ML SN GH CM ET|AU NZ GB US CU CL PH CZ|ID PL AT LV PE CA|NO IS DK SE FI CH|AR UY GR EE|IQ EG JO AE SA IR LB QA|JP BD KR CN VN TR TN DZ PK MA|CO EC VE|IN NE CI IE|LT BO GH ET|UA SE KZ".split("|").map(g=>g.split(" "));
const RG="FR DE ES IT PT GB BE CH NL IE LU AT MT|SE NO DK FI IS EE LV LT|PL CZ HU RO UA HR RS SK SI BG AL GR RU|TR GE AM AZ IR IQ JO LB SA AE QA|MA DZ TN EG|SN CI NG CM GH ML TD NE|ZA KE ET MG|JP CN KR IN PK BD LK NP MM KH TH VN ID PH MN KZ|AU NZ|US CA MX CU|BR AR CO VE PE CL EC BO PY UY".split("|").map(g=>g.split(" "));
const near=a=>{const G=(S.mode==="flag"||S.mode==="pf")?FG:RG,o=new Set();G.forEach(g=>{if(g.includes(a.c))g.forEach(c=>{if(c!==a.c)o.add(c)})});return o};
const build=(seed,lv)=>{
 const r=rng(seed),L=LV[lv],pool=C.filter(x=>x.t<=L.pool),n=(S.mode==="pf"?(L.ch>6?6:4):L.ch)-1;
 return shuf(pool,r).slice(0,20).map(a=>{
  let d=[];
  if(lv>=3){const nr=near(a);d=shuf(pool.filter(x=>x!==a&&nr.has(x.c)),r).slice(0,lv===3?Math.ceil(n/2):n)}
  const rest=shuf(pool.filter(x=>x!==a&&!d.includes(x)),r).slice(0,n-d.length);
  return{a,o:shuf([a,...d,...rest],r)};
 });
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const S={theme:"auto",view:"home",name:"",lv:2,mode:"flag",unsub:null,host:false,room:null,qs:[],i:0,score:0,left:0,locked:false,pick:null,peers:[],lastId:0,err:"",solo:true};
const app=$("app");

const LC={1:"#10b981",2:"#3b82f6",3:"#f59e0b",4:"#ef4444"};
function lvButtons(editable){
 return `<div class="lvl">${[1,2,3,4].map(k=>`<button class="lr ${S.lv===k?"on":""}" ${editable?`data-lv="${k}"`:"disabled"}><span class="bars">${[1,2,3,4].map(i=>`<i style="${i<=k?`background:${LC[k]}`:""}"></i>`).join("")}</span><span class="lt"><b>${LV[k].n}</b><small>${LV[k].h}</small></span><span class="cf">×${String(LV[k].coef).replace(".",",")}</span></button>`).join("")}</div>`;
}
function home(){
 const acc=S.uid?`${REMOTE?"Pseudo":"Joueur"} : <b>${esc(S.name||"")}</b> · <button id="chg" class="lk">${REMOTE?"changer de pseudo":"changer de joueur"}</button>`:`Non connecté : tes scores ne seront pas enregistrés. Choisis un pseudo.`;
 app.innerHTML=`<div class="tb">${themeCtl()}</div><h1>Geo Quizz<span>.</span></h1><p class="sub">Choisis ton thème.</p>
 <div class="card mute" style="text-align:left">${acc}</div>
 <button class="nav" id="sd"><span class="nt" style="background:linear-gradient(135deg,#2563eb,#7c3aed)"><svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h13l-2.500 4.500L18 13H5"/></svg></span><span><b>Drapeaux</b><small>Pays d’un drapeau · Drapeau d’un pays</small></span><i>›</i></button><button class="nav" id="sc"><span class="nt" style="background:linear-gradient(135deg,#f59e0b,#ef4444)"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V11m4 10V11m6 10V11m4 10V11M2.500 11 12 4l9.500 7z"/></svg></span><span><b>Capitales</b><small>Capitale d’un pays · Pays d’une capitale</small></span><i>›</i></button><button class="nav" id="rk"><span class="nt" style="background:linear-gradient(135deg,#10b981,#059669)"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg></span><span><b>Classements</b><small>Meilleurs scores par jeu et par niveau</small></span><i>›</i></button>`;
 bindTheme();const cg=$("chg");if(cg)cg.onclick=nameScreen;$("sd").onclick=()=>menu("d");$("sc").onclick=()=>menu("c");$("rk").onclick=rank;
}
const fmt=n=>(+n||0).toLocaleString("fr-FR");
async function scoresBox(mode){
 const el=$("sc2");if(!el)return;
 if(!DB||!S.uid){el.innerHTML=`<p class="mute">Connecte-toi pour enregistrer et voir tes scores.</p>`;return}
 try{
  const snap=await DB.collection("players").get();
  const rows=snap.docs.map(d=>({id:d.id,s:tv(d.data(),mode),n:d.data().u||"Joueur"})).filter(r=>r.s>0).sort((a,b)=>b.s-a.s);
  if(S.view!=="menu"||S.mode!==mode||!$("sc2"))return;
  const i=rows.findIndex(r=>r.id===S.uid),me=i>=0?rows[i].s:0,top=rows[0];
  el.innerHTML=`<div class="pl"><span>Mon meilleur score</span><b>${me?fmt(me):"–"}</b></div><div class="pl"><span>Mon rang</span><b>${i>=0?`${i+1} / ${rows.length}`:"–"}</b></div><div class="pl"><span>Leader</span><b>${top?`${esc(top.n)} · ${fmt(top.s)}`:"–"}</b></div>`;
 }catch(e){const x=$("sc2");if(x)x.innerHTML=`<p class="mute">Scores indisponibles.</p>`}
}
function menu(sec){
 S.view="menu";S.sec=sec;if(!SEC[sec].includes(S.mode))S.mode=SEC[sec][0];
 app.innerHTML=`<h1>${sec==="d"?"Drapeaux":"Capitales"}<span>.</span></h1><p class="sub">Choisis ton jeu et ta difficulté.</p>
 <div class="card"><label>Jeu</label>${modeButtons(SEC[sec])}<label style="margin-top:14px">Difficulté</label>${lvButtons(true)}</div>
 <div class="card"><label>Mes scores · ${MODES[S.mode]}</label><div id="sc2"><p class="mute">Chargement…</p></div></div>
 <button class="btn" id="go">Jouer</button><button class="btn alt" id="bk">Retour</button>`;
 app.querySelectorAll("[data-md]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.md;menu(sec)});
 app.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{S.lv=+b.dataset.lv;menu(sec)});
 $("go").onclick=()=>start(Date.now()%2147483647,S.lv);
 $("bk").onclick=()=>{S.view="home";home()};
 scoresBox(S.mode);
}
let USER=null,DB=null;
const KEY=()=>S.mode+"-"+S.lv;
const slug=n=>n.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const LDB=(()=>{
 const rd=()=>{try{return JSON.parse(localStorage.getItem("gq-db")||"{}")}catch(e){return{}}},wr=o=>{try{localStorage.setItem("gq-db",JSON.stringify(o))}catch(e){}};
 return{collection:c=>({
  doc:id=>({
   get:async()=>{const v=(rd()[c]||{})[id];return{exists:!!v,data:()=>v}},
   set:async o=>{const a=rd();(a[c]=a[c]||{})[id]=o;wr(a)},
   delete:async()=>{const a=rd();if(a[c])delete a[c][id];wr(a)}}),
  get:async()=>({docs:Object.entries(rd()[c]||{}).map(([id,v])=>({id,data:()=>v}))})
 })}
})();
const RDB=base=>({collection:c=>({
 doc:id=>({
  get:async()=>{const r=await fetch(`${base}/${c}/${id}.json`);if(!r.ok)throw 0;const v=await r.json();return{exists:v!=null,data:()=>v}},
  set:async o=>{const r=await fetch(`${base}/${c}/${id}.json`,{method:"PUT",body:JSON.stringify(o)});if(!r.ok)throw 0},
  delete:async()=>{await fetch(`${base}/${c}/${id}.json`,{method:"DELETE"})}}),
 get:async()=>{const r=await fetch(`${base}/${c}.json`);if(!r.ok)throw 0;const v=(await r.json())||{};return{docs:Object.entries(v).map(([id,x])=>({id,data:()=>x}))}}
})});
async function claimLocal(raw){
 const name=raw.trim().replace(/\s+/g," "),key=slug(name);
 if(name.length<3||name.length>16||key.length<3)return "invalid";
 const id="u_"+key,ref=DB.collection("players").doc(id),sn=await ref.get(),d=(sn.exists&&sn.data())||{};
 await ref.set({...d,u:d.u||name,k:key});
 S.uid=id;S.key=key;S.name=d.u||name;
 try{localStorage.setItem("gq-me",id)}catch(e){}
 return "ok";
}
async function claimRemote(raw){
 const name=raw.trim().replace(/\s+/g," "),key=slug(name);
 if(name.length<3||name.length>16||key.length<3)return "invalid";
 const nref=DB.collection("names").doc(key),s1=await nref.get();
 if(s1.exists&&s1.data().id!==S.uid)return "taken";
 await nref.set({id:S.uid,n:name});
 const s2=await nref.get();
 if(!s2.exists||s2.data().id!==S.uid)return "taken";
 if(S.key&&S.key!==key){try{await DB.collection("names").doc(S.key).delete()}catch(e){}}
 const pref=DB.collection("players").doc(S.uid),ps=await pref.get(),d=(ps.exists&&ps.data())||{};
 await pref.set({...d,u:name,k:key});
 S.name=name;S.key=key;return "ok";
}
const claimName=raw=>REMOTE?claimRemote(raw):claimLocal(raw);
function nameScreen(){
 S.view="name";
 app.innerHTML=`<h1>${REMOTE?"Ton pseudo":"Qui joue ?"}<span>.</span></h1><p class="sub">${REMOTE?"Il apparaît dans le classement de tous les joueurs et doit être unique (3 à 16 caractères).":"Plusieurs amis peuvent jouer sur le même appareil : chaque pseudo a son profil (3 à 16 caractères)."}</p>
 <div class="card"><label for="un">Pseudo</label><input id="un" maxlength="16" autocomplete="off" value="${esc(S.name||S.suggest||"")}"><p class="err" id="ue"></p></div>
 <button class="btn" id="ok">Valider</button>${S.name?`<button class="btn alt" id="cx">Annuler</button>`:""}`;
 $("ok").onclick=async()=>{
  $("ok").disabled=true;let r;
  try{r=await claimName($("un").value)}catch(e){r="err"}
  if(r==="ok"){S.view="home";home()}
  else{$("ue").textContent=r==="taken"?"Ce pseudo est déjà pris.":r==="invalid"?"3 à 16 caractères, avec des lettres ou des chiffres.":"Erreur, réessaie.";$("ok").disabled=false}
 };
 const c=$("cx");if(c)c.onclick=()=>{S.view="home";home()};
}
async function boot(){
 try{const t=localStorage.getItem("gq-theme");if(t)applyTheme(t)}catch(e){}
 if(REMOTE){
  DB=RDB(FIREBASE_URL.replace(/\/+$/,""));
  let id=null;
  try{id=localStorage.getItem("gq-dev");if(!id){id="d"+Math.random().toString(36).slice(2,10)+Date.now().toString(36);localStorage.setItem("gq-dev",id)}}catch(e){id="d"+Math.random().toString(36).slice(2,10)}
  S.uid=id;
  try{const sn=await DB.collection("players").doc(id).get(),d=sn.exists&&sn.data();S.name=(d&&d.u)||null;S.key=(d&&d.k)||null}catch(e){}
  if(!S.name)return nameScreen();
  return home();
 }
 DB=LDB;
 let me=null;try{me=localStorage.getItem("gq-me")}catch(e){}
 if(me){try{const sn=await DB.collection("players").doc(me).get(),d=sn.exists&&sn.data();if(d&&d.u){S.uid=me;S.name=d.u;S.key=d.k||null}}catch(e){}}
 if(!S.uid)return nameScreen();
 home();
}
const MK=["flag","pf","cap","cp"];
const legacy=(d,m)=>d.b?Math.max(0,...[1,2,3,4].map(k=>+d.b[m+"-"+k]||0)):0;
const bm=(d,m)=>Math.max(+(d.m&&d.m[m])||0,legacy(d,m));
const tv=(d,m)=>m==="all"?Math.max(...MK.map(k=>bm(d,k))):bm(d,m);
async function save(){
 if(!DB||!S.uid)return null;
 try{
  const ref=DB.collection("players").doc(S.uid),snap=await ref.get(),d=(snap.exists&&snap.data())||{},m={};
  MK.forEach(k=>{m[k]=bm(d,k)});
  const old=m[S.mode];m[S.mode]=Math.max(old,S.score);
  await ref.set({...d,m,p:(+d.p||0)+1});
  return{best:m[S.mode],rec:S.score>old};
 }catch(e){return "err"}
}
async function rank(){
 const t=S.rt=(S.rt||0)+1;S.view="rank";S.rows=null;S.board=S.board||"all";drawRank();
 let rows=[];
 try{
  if(DB){
   const snap=await DB.collection("players").get();
   rows=snap.docs.map(d=>({id:d.id,s:tv(d.data(),S.board),n:d.data().u||"Joueur",reg:!!d.data().u})).filter(r=>r.s>0||r.reg).sort((a,b)=>b.s-a.s);
  }
 }catch(e){rows=[]}
 if(t!==S.rt||S.view!=="rank")return;
 S.rows=rows;drawRank();
}
function drawRank(){
 const rows=S.rows;
 app.innerHTML=`<h1>Classement<span>.</span></h1><p class="sub">Meilleur score de chaque joueur${rows?` · ${rows.length} joueur${rows.length>1?"s":""}`:""}.</p>
 <div class="card"><label>Classement</label>${modeButtons(["all",...MK],S.board)}</div>
 <div class="card">${rows===null?`<p class="mute">Chargement…</p>`:rows.length?rows.map((r,i)=>`<div class="pl"><span class="${r.id===S.uid?"me":""}">${i+1}. ${esc(r.n)}</span><b>${r.s?fmt(r.s):"–"}</b></div>`).join(""):`<p class="mute">${DB?"Aucun score pour l’instant. Sois le premier !":"Connecte-toi à ton compte pour voir le classement."}</p>`}</div>
 <button class="btn alt" id="hm">Accueil</button>`;
 app.querySelectorAll("[data-md]").forEach(b=>b.onclick=()=>{S.board=b.dataset.md;rank()});
 $("hm").onclick=()=>{S.view="home";home()};
}
function start(seed,lv){
 S.lv=lv;S.qs=build(seed,lv);S.i=0;S.score=0;
 showQ();
}
function showQ(){
 S.locked=false;S.pick=null;S.view="play";S.left=LV[S.lv].time;play();
 clearInterval(S.t);
 S.t=setInterval(()=>{S.left=Math.max(0,S.left-.1);const b=$("tm");if(b){b.style.width=(S.left/LV[S.lv].time*100)+"%"}const t=$("ts");if(t)t.textContent=Math.ceil(S.left)+" s";if(S.left<=0)answer(null)},100);
}
function play(){
 const q=S.qs[S.i];
 app.innerHTML=`<div class="top"><span>Question ${S.i+1}/20</span><span>${LV[S.lv].n} · <b>${S.score}</b> pts</span></div>
 <div class="bar"><i id="tm" style="width:${S.left/LV[S.lv].time*100}%"></i></div>
 <div class="card flag" style="margin-top:14px">${S.mode==="pf"||S.mode==="cp"?`<div style="font:800 2rem 'Inter',system-ui,sans-serif;padding:14px 0">${esc(S.mode==="cp"?q.a.k:q.a.n)}</div>`:flag(q.a.c)}${S.mode==="cap"?`<div style="font:800 1.5rem 'Inter',system-ui,sans-serif;margin-top:6px">${esc(q.a.n)}</div>`:""}</div>
 <div class="top"><span class="mute">${{flag:"À quel pays appartient ce drapeau ?",cap:"Quelle est sa capitale ?",pf:"Quel est son drapeau ?",cp:"De quel pays est-ce la capitale ?"}[S.mode]}</span><span id="ts" class="mute">${Math.ceil(S.left)} s</span></div>
 <div class="opts">${q.o.map((o,k)=>{let c="";if(S.locked){if(o===q.a)c="ok";else if(k===S.pick)c="no"}return `<button class="opt ${c} ${S.mode==="pf"?"fl":""}" data-k="${k}">${S.mode==="pf"?flag(o.c):S.mode==="cp"?`<span style="display:block;font-size:2rem;line-height:1.3;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">${flag(o.c)}</span>${esc(o.n)}`:esc(S.mode==="cap"?o.k:o.n)}</button>`}).join("")}</div>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}
function answer(k){
 if(S.locked)return;S.locked=true;clearInterval(S.t);S.pick=k;
 const q=S.qs[S.i];
 if(k!==null&&q.o[k]===q.a)S.score+=Math.round((100+50*S.left/LV[S.lv].time)*LV[S.lv].coef);
 play();
 setTimeout(()=>{S.i++;if(S.i>=20)finish();else showQ()},1200);
}
const isRec=()=>S.uid?!!(S.res&&S.res.rec):!!S.sessRec;
function confetti(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const cols=["#2563eb","#f59e0b","#10b981","#ef4444","#7c3aed","#ec4899"],box=document.createElement("div");
 box.className="fx";
 for(let i=0;i<46;i++){const p=document.createElement("i");p.style.cssText=`left:${Math.random()*100}%;background:${cols[i%6]};width:${6+Math.random()*6}px;height:${10+Math.random()*8}px;animation-delay:${Math.random()*.5}s;animation-duration:${1.8+Math.random()*1.4}s;--dx:${(Math.random()-.5)*160}px`;box.appendChild(p)}
 document.body.appendChild(box);setTimeout(()=>box.remove(),3600);
}
async function finish(){S.fx=0;const sb=S.sb=S.sb||{},pv=sb[S.mode]||0;S.sessRec=pv>0&&S.score>pv;if(S.score>pv)sb[S.mode]=S.score;S.view="end";S.res=null;end();S.res=await save();if(S.view==="end")end()}
function end(){
 const m=S.res&&S.res.best!==undefined?`Meilleur score : ${fmt(S.res.best)} pts`:S.res==="err"?"Enregistrement impossible.":S.uid?"Enregistrement…":"Connecte-toi pour enregistrer tes scores.";
 app.innerHTML=`<h1>Terminé<span>.</span></h1><p class="sub">${MODES[S.mode]} · ${LV[S.lv].n}</p>
 <div class="card">${isRec()?`<div class="badge">Nouveau meilleur score</div>`:""}<div class="big ${isRec()?"pop":""}">${S.score}</div><p class="mute">points sur ${(3000*LV[S.lv].coef).toLocaleString("fr-FR")} possibles</p><p class="mute">${m}</p></div>
 <button class="btn" id="again">Rejouer</button><button class="btn alt" id="rk">Voir le classement</button><button class="btn alt" id="hm">Accueil</button>`;
 if(isRec()&&!S.fx){S.fx=1;confetti()}
 $("again").onclick=()=>start(Date.now()%2147483647,S.lv);
 $("rk").onclick=rank;$("hm").onclick=()=>{S.view="home";home()};
}
boot();
</script></body></html>
