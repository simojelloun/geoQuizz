<style>

:root[data-visual="glass"] body{background:var(--bg);background-attachment:fixed}

:root[data-visual="sunset"] .card,:root[data-visual="sunset"] .nav,:root[data-visual="sunset"] .opt,:root[data-visual="sunset"] .lvb,:root[data-visual="sunset"] .dz.done,:root[data-visual="sunset"] select,:root[data-visual="sunset"] input{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);box-shadow:0 2px 12px rgba(0,0,0,.2)}

*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
main{max-width:480px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.9rem;line-height:1.15;margin:4px 0 6px;font-weight:700;letter-spacing:-.02em}
h1 span{color:var(--acc)}
.sub{color:var(--mute);margin:0 0 22px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
label{font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);display:block;margin-bottom:10px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvb{padding:11px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:500;font-size:.92rem;transition:.15s}
.lvb small{display:block;font-weight:400;color:#f59e0b;font-size:.75rem;margin-top:2px}
.lvb.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card));color:var(--acc);font-weight:600}.lvb.on small{color:#f59e0b}
.btn{width:100%;padding:14px;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:var(--onacc);font-weight:600;font-size:1rem;margin-top:10px;transition:.15s}
.btn.alt{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn:active{filter:brightness(.92)}
.btn[disabled]{opacity:.45}
.nav{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.nt{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}.nav svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav span{flex:1}.nav .nt{flex:none}.nav b{display:block;font-weight:600;font-size:1.05rem}.nav small{color:var(--mute);font-size:.82rem}
.hd{display:flex;align-items:center;gap:16px;margin:4px 0 18px;padding:18px;border-radius:16px;color:#fff;box-shadow:0 6px 18px -8px rgba(0,0,0,.45)}.hd .nt{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.18)}.hd svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.hd h1{margin:0;color:#fff}.hd h1 span{color:rgba(255,255,255,.7)}.hd .sub{margin:3px 0 0;color:rgba(255,255,255,.88)}
.nav i{color:var(--mute);font-style:normal;font-size:1.4rem}
.nav:active{background:var(--bg)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:500;margin-bottom:10px;font-size:.92rem}
.top b{font-weight:700}
.bar{height:6px;border-radius:6px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .1s linear}
.flag{font-size:7rem;line-height:1.15;text-align:center;padding:22px 0;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:14px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:500;font-size:.98rem;min-height:58px;box-shadow:0 1px 2px rgba(16,24,40,.05);transition:.15s}
.fi{height:.72em;width:auto;max-width:1.7em;vertical-align:-.08em;border-radius:.07em;box-shadow:0 0 0 1px rgba(12,27,46,.12);object-fit:contain}
.flag .fi{height:6rem;max-width:min(78vw,11rem);border-radius:6px;box-shadow:0 6px 18px -8px rgba(12,27,46,.45),0 0 0 1px rgba(12,27,46,.1)}
.opt.fl .fi{height:2.6rem;max-width:4.4rem}
.opt.fl{font-size:3.2rem;line-height:1.2;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no{background:var(--bad);border-color:var(--bad);color:#fff}
.pl{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border:0}.pl b{font-weight:700}.pl .me{color:var(--acc);font-weight:600}
.big{font-size:3.6rem;font-weight:700;text-align:center;line-height:1;color:var(--acc);letter-spacing:-.03em}
.mute{color:var(--mute);font-size:.9rem;text-align:center}
.err{color:var(--bad);font-weight:600;text-align:center;margin:8px 0}
.lvb.md{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px}
.mi{display:inline-flex;align-items:center;gap:1px;padding:7px 8px;border-radius:11px;flex:none;box-shadow:0 2px 6px -2px rgba(0,0,0,.35)}
.mi svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb{display:flex;justify-content:flex-end;margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:3px}
.seg button{width:36px;height:30px;border:0;background:transparent;border-radius:999px;display:grid;place-items:center;color:var(--mute)}
.seg button.on{background:var(--acc);color:var(--onacc)}
.seg svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lvl{display:flex;flex-direction:column;gap:8px}
.lr{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);transition:.15s}
.lr.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--card))}
.bars{display:flex;align-items:flex-end;gap:3px;height:22px;flex:none}
.bars i{width:5px;border-radius:2px;background:var(--line)}
.bars i:nth-child(1){height:7px}.bars i:nth-child(2){height:12px}.bars i:nth-child(3){height:17px}.bars i:nth-child(4){height:22px}
.lt{flex:1}.lt b{display:block;font-weight:600}.lt small{color:var(--mute);font-size:.8rem}
.cf{font-weight:700;font-size:.82rem;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.lr.on .cf{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
select{width:100%;font:inherit;font-size:1rem;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
.lk{border:0;background:none;color:var(--acc);font:inherit;padding:0;text-decoration:underline}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.fx i{position:absolute;top:-24px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .6s ease-out}
.badge{display:table;margin:0 auto 12px;padding:5px 14px;border-radius:999px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;font-weight:700;font-size:.8rem;letter-spacing:.04em;animation:pop .5s .15s both}
@media (prefers-reduced-motion:reduce){.pop,.badge{animation:none}}
.opt.mp{padding:4px;overflow:hidden;border-radius:12px}.opt.mp svg{pointer-events:none;border-radius:8px}.opt.mp.ok svg .tg{fill:#fff;stroke:#fff}.opt.mp.ok svg .nb{fill:rgba(255,255,255,.18);stroke:rgba(255,255,255,.35)}.opt.mp.ok svg rect{fill:var(--ok)}.opt.mp.no svg .tg{fill:#fff;stroke:#fff}.opt.mp.no svg .nb{fill:rgba(255,255,255,.18);stroke:rgba(255,255,255,.35)}.opt.mp.no svg rect{fill:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px;z-index:40}
.ov .card{max-width:360px;width:100%;margin:0;text-align:center}
.lvl{gap:6px}
.lr{gap:10px;padding:7px 10px;border-radius:10px}
.bars{height:16px;gap:2px}.bars i{width:4px}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:12px}.bars i:nth-child(4){height:16px}
.lt b{font-size:.9rem}.lt small{font-size:.72rem}
.cf{font-size:.75rem;padding:2px 8px}
.lvl{flex-direction:row;gap:6px}
.lr{flex:1;min-width:0;flex-direction:column;justify-content:flex-start;align-items:center;gap:5px;padding:9px 2px;text-align:center}
.lt{flex:none}.lt b{font-size:.76rem;line-height:1.15}.lt small{display:none}

/* ===== Atlas ===== */
:root{--bg:#eef4f8;--card:#fff;--ink:#0c1b2e;--mute:#5b6b7d;--acc:#0b5cad;--acc2:#12a594;--sun:#ffb703;--onacc:#fff;--ok:#12a150;--bad:#e5484d;--line:#d6e1eb;--edge:#c3d2e0;--grid:rgba(11,92,173,.07);--pass:#0b3c6f;--D:'Bricolage Grotesque','DM Sans','IBM Plex Sans Arabic',system-ui,sans-serif}
:root[data-theme="dark"]{--bg:#081726;--card:#0f2438;--ink:#e9f0f7;--mute:#8ea2b8;--acc:#4da3ff;--acc2:#2fd0bd;--onacc:#06121f;--ok:#2fb36a;--bad:#f2555a;--line:#1d3550;--edge:#0a1a2b;--grid:rgba(77,163,255,.07);--pass:#123e6b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081726;--card:#0f2438;--ink:#e9f0f7;--mute:#8ea2b8;--acc:#4da3ff;--acc2:#2fd0bd;--onacc:#06121f;--ok:#2fb36a;--bad:#f2555a;--line:#1d3550;--edge:#0a1a2b;--grid:rgba(77,163,255,.07);--pass:#123e6b}}
body{font-family:'DM Sans','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 44px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/44px 100%,var(--bg);background-attachment:fixed}
h1{font-family:var(--D);font-weight:800;font-size:2.1rem;letter-spacing:-.03em}
h1 span{color:var(--sun)}
label{text-transform:none;letter-spacing:0;font-size:.85rem}
.card{border-radius:16px;box-shadow:0 3px 0 var(--edge)}
.btn{font-family:var(--D);border:0;border-radius:12px;font-weight:800;font-size:1.05rem;box-shadow:0 4px 0 color-mix(in srgb,var(--acc) 62%,#000);transition:transform .08s,box-shadow .08s}
.btn:active{filter:none;transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--acc) 62%,#000)}
.btn.alt{border:1px solid var(--line);box-shadow:0 4px 0 var(--edge);font-weight:600}
.btn.alt:active{box-shadow:0 1px 0 var(--edge)}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,.nav:focus-visible,.dz:focus-visible,.lr:focus-visible,.lvb:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hb{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.hb h1{margin:0}
.pc{display:flex;gap:16px;align-items:center;background:var(--pass);color:#fff;border:0;position:relative;padding:20px}
.pc:before{content:"";position:absolute;inset:7px;border:1px dashed rgba(255,255,255,.28);border-radius:10px;pointer-events:none}
.stamp{width:68px;height:68px;border-radius:50%;border:2.5px solid var(--sun);outline:1px solid var(--sun);outline-offset:3px;color:var(--sun);display:grid;place-items:center;text-align:center;transform:rotate(-9deg);flex:none;font:800 1.7rem/1 var(--D)}
.stamp small{display:block;font:700 .5rem/1.4 'DM Sans',sans-serif;letter-spacing:.14em}
.pi{flex:1;min-width:0}.pn{font:800 1.25rem/1.2 var(--D);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pt{font-size:.85rem;opacity:.85}
.pc .lk{color:#fff;opacity:.75;font:500 .75rem 'DM Sans','IBM Plex Sans Arabic',sans-serif;margin-inline-start:8px}
.xp{height:8px;border-radius:8px;background:rgba(255,255,255,.2);margin:9px 0 5px;overflow:hidden}.xp i{display:block;height:100%;background:var(--sun);border-radius:8px}
.px{font-size:.74rem;opacity:.85;display:flex;justify-content:space-between;gap:8px}
.strk{display:flex;align-items:center;gap:8px;margin:0 2px 14px;font-size:.88rem;color:var(--mute)}
.strk svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.strk.on{color:var(--ink)}.strk.on svg{stroke:#e8590c;fill:#ffb703}
.dz{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;margin-bottom:18px;border:0;border-radius:16px;background:var(--sun);color:#2b1d00;box-shadow:0 4px 0 #c98f00;transition:transform .08s,box-shadow .08s}
.dz:active{transform:translateY(3px);box-shadow:0 1px 0 #c98f00}
.dz span{flex:1}.dz b{display:block;font:800 1.15rem/1.2 var(--D)}.dz small{font-size:.82rem;opacity:.85}
.dz em{font:800 .9rem var(--D);font-style:normal;background:#2b1d00;color:var(--sun);padding:8px 14px;border-radius:999px;flex:none}
.dz.done{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--edge);border:1px solid var(--line)}.dz.done em{background:var(--bg);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{display:block;text-align:left;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.tile .nt{margin-bottom:12px}.tile svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font:800 1.15rem/1.2 var(--D)}.tile small{color:var(--mute);font-size:.82rem}
.nav{border-radius:16px;box-shadow:0 4px 0 var(--edge);transition:transform .08s,box-shadow .08s}.nav .nt{flex:none}.nav b{font-family:var(--D);font-weight:800}
.nav:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge);background:var(--card)}
.hd{box-shadow:0 4px 0 rgba(0,0,0,.18)}
.lr,.lvb{border-radius:12px}

/* fond d'écran : carte du monde en points */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:#1d6fd1;opacity:.26;-webkit-mask:var(--wm) center 46%/min(1300px,240vw) auto no-repeat;mask:var(--wm) center 46%/min(1300px,240vw) auto no-repeat}
/* thèmes de saison : Noël (15 déc - 15 janv) et Ramadan */
#ssn{position:fixed;inset:0;z-index:0;pointer-events:none;display:none;overflow:hidden}
#app{position:relative;z-index:1}
:root[data-season] #ssn{display:block}
:root[data-season=xmas] body{background:linear-gradient(180deg,#7fa9cf 0%,#a9c8e4 40%,#d9e8f4 100%);background-attachment:fixed}:root[data-season=xmas] #ssn{z-index:2;opacity:.85}:root[data-season=xmas] .shd{color:#24415e}
:root[data-season=xmas] #ssn{background-image:radial-gradient(3px 3px at 20px 30px,#fff 50%,transparent 51%),radial-gradient(2px 2px at 90px 120px,#fff 50%,transparent 51%),radial-gradient(4px 4px at 160px 60px,#fff 50%,transparent 51%),radial-gradient(2.5px 2.5px at 60px 170px,#fff 50%,transparent 51%),radial-gradient(3px 3px at 130px 200px,#fff 50%,transparent 51%);background-size:200px 220px;animation:snow 14s linear infinite;filter:drop-shadow(0 0 1px rgba(90,130,170,.6))}
:root[data-season=xmas] #ssn::after{content:"";position:absolute;inset:0;background-image:radial-gradient(2px 2px at 40px 50px,#fff 50%,transparent 51%),radial-gradient(3px 3px at 110px 140px,#fff 50%,transparent 51%),radial-gradient(2px 2px at 170px 20px,#fff 50%,transparent 51%);background-size:180px 160px;animation:snow 9s linear infinite;opacity:.9}
@keyframes snow{from{background-position:0 0}to{background-position:40px 440px}}
:root[data-season=ram] body{background:radial-gradient(ellipse at 80% -10%,#3b3a8f 0%,transparent 55%),linear-gradient(180deg,#14163f 0%,#1d2160 60%,#2a2470 100%);background-attachment:fixed}
:root[data-season=ram] body::before{background:#e8d9a8;opacity:.07}
:root[data-season=ram] #ssn{background-image:radial-gradient(1.5px 1.5px at 30px 40px,#fff8d6 50%,transparent 51%),radial-gradient(1px 1px at 120px 90px,#fff 50%,transparent 51%),radial-gradient(2px 2px at 200px 30px,#ffe9a8 50%,transparent 51%),radial-gradient(1px 1px at 70px 160px,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 170px 190px,#fff8d6 50%,transparent 51%);background-size:240px 230px;animation:twk 3.5s ease-in-out infinite alternate}
@keyframes twk{from{opacity:.45}to{opacity:1}}
:root[data-season=ram] .hb h1,:root[data-season=ram] .shd,:root[data-season=ram] .rh h1{color:#f6ebc8}
:root[data-season=ram] .hb h1 span,:root[data-season=ram] .rh h1 span{color:#ffd166}
.sdeco{display:none}.sdeco svg{display:block;width:100%;height:auto}
:root[data-season] .sdeco{display:block;position:absolute;pointer-events:none}
.hb{position:relative}
:root[data-season] .hb h1{position:relative}
.sdeco.hat{width:34px;top:-15px;inset-inline-start:-12px;transform:rotate(-24deg)}
:root[data-season] .sdeco.sdk{display:flex;align-items:flex-end;gap:2px;position:absolute;top:-4px;inset-inline-start:min(48%,196px);height:54px}
.sdk>span{display:block}.sdk .santa{width:50px;animation:bob 4s ease-in-out infinite}.sdk .gifts{width:34px}.sdk .moon{width:42px;align-self:flex-start;filter:drop-shadow(0 0 10px rgba(255,214,102,.8));animation:bob 6s ease-in-out infinite}.sdk .lan{width:16px;align-self:flex-start;transform-origin:50% 0;animation:swing 4s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@media (max-width:360px){.sdk .gifts{display:none}}
@media (prefers-reduced-motion:reduce){#ssn,.sdeco,.sdk span{animation:none!important}#ssn::after{animation:none}}

/* fond d'écran bien visible en mode normal : océan clair + carte du monde en points */
:root:not([data-season]):not([data-visual=glass]):not([data-visual=sunset]) body{background:radial-gradient(ellipse at 15% 0%,#bfe3ff 0%,transparent 55%),radial-gradient(ellipse at 90% 100%,#c8f2df 0%,transparent 55%),linear-gradient(180deg,#e2f1ff 0%,#eef8f6 100%);background-attachment:fixed}
:root[data-theme=dark]:not([data-season]):not([data-visual=glass]):not([data-visual=sunset]) body{background:radial-gradient(ellipse at 15% 0%,#123a6b 0%,transparent 55%),radial-gradient(ellipse at 90% 100%,#0d4a3a 0%,transparent 55%),linear-gradient(180deg,#0b1a33 0%,#0c2230 100%);background-attachment:fixed}
:root[data-theme=dark] body::before{background:#5fb0ff;opacity:.22}

/* fond d'écran adapté au thème choisi (auto, clair, sombre, verre, coucher de soleil) */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]):not([data-season]):not([data-visual=glass]):not([data-visual=sunset]) body{background:radial-gradient(ellipse at 15% 0%,#123a6b 0%,transparent 55%),radial-gradient(ellipse at 90% 100%,#0d4a3a 0%,transparent 55%),linear-gradient(180deg,#0b1a33 0%,#0c2230 100%);background-attachment:fixed}:root:not([data-theme=light]) body::before{background:#5fb0ff;opacity:.22}}
:root[data-theme=light]:not([data-season]):not([data-visual=glass]):not([data-visual=sunset]) body::before{background:#1d6fd1;opacity:.26}
:root[data-visual=glass] body::before{background:#a5b4fc!important;opacity:.2!important}
:root[data-visual=sunset] body::before{background:var(--acc)!important;opacity:.24!important}
:root[data-season=ram] body::before{background:#e8d9a8!important;opacity:.09!important}
:root[data-season=xmas] body::before{background:#fff!important;opacity:.35!important}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .shd small#fgl{background:#0f3a24;color:#a7f3c4;border-color:#1f7a47}:root:not([data-theme=light]) .shd small#fgl[data-n="0"]{background:#3d2608;color:#fcd9a0;border-color:#8a5a14}}

/* trophée plein écran */
#tro{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 42%,rgba(255,196,0,.5),rgba(10,20,45,.93) 62%);color:#fff;cursor:pointer;animation:troin .35s ease-out}
#tro.out{opacity:0;transition:opacity .3s}
#tro .troc{position:relative;width:min(56vw,240px);height:min(56vw,240px);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffe98a,#f5b301 60%,#c98200);box-shadow:0 0 0 10px rgba(255,255,255,.18),0 0 80px 20px rgba(255,190,0,.65);animation:tropop .7s cubic-bezier(.2,1.5,.4,1) both,bob 3s ease-in-out .7s infinite}
#tro .troc svg{width:56%;height:56%;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 3px 0 rgba(120,70,0,.5))}
#tro .tror{position:absolute;top:42%;left:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(rgba(255,220,120,.16) 0 9deg,transparent 9deg 18deg);animation:trorot 14s linear infinite;pointer-events:none}
#tro b{position:relative;font:800 1.9rem/1.15 var(--D);margin-top:18px;text-shadow:0 2px 0 rgba(0,0,0,.35)}#tro small{position:relative;font-size:1rem;opacity:.92}
@keyframes troin{from{opacity:0}}@keyframes tropop{from{transform:scale(.2) rotate(-25deg);opacity:0}}@keyframes trorot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#tro .troc,#tro .tror{animation:none}}
/* coffres de ligue */
.rch{display:inline-flex;flex-direction:column;align-items:center;margin-inline-start:auto;padding-inline:8px;line-height:1;flex:none}.rch small{font:800 .62rem/1 var(--D);color:var(--mute);margin-top:1px}
.chs{display:block;height:auto;filter:drop-shadow(0 3px 3px rgba(0,0,0,.28))}

 const ns=await DB.collection("names").doc(key).get().catch(()=>null);
 if(ns&&ns.exists&&ns.data()&&String(ns.data().id||"").length>=28)throw E("TAKEN");
 const sl=await seal(em.trim(),pw);

 SES.pend={n:name,k:key,seal:sl};persist();

addTr([["Jouer une partie","Playing a game","لعب مباراة"],["Les jeux","The games","الألعاب"],["Parties offertes et gemmes","Free games and gems","المباريات المجانية والجواهر"],["Niveaux de difficulté","Difficulty levels","مستويات الصعوبة"],["Les jokers","Lifelines","وسائل المساعدة"],["Chaque jour","Every day","كل يوم"],["Classements et ligues","Leaderboards and leagues","الترتيب والدوريات"],["Réviser et Atlas","Review and Atlas","المراجعة والأطلس"],["Duels, amis et groupes","Duels, friends and groups","المبارزات والأصدقاء والمجموعات"],["Compte et sécurité","Account and safety","الحساب والأمان"],["Choisis un jeu sur l’accueil, puis une difficulté. Tu as 10 secondes par question : plus tu réponds vite, plus tu marques de points. Le grand bouton Jouer relance ton dernier jeu.","Pick a game on the home screen, then a difficulty. You have 10 seconds per question: the faster you answer, the more points you score. The big Play button restarts your last game.","اختر لعبة من الصفحة الرئيسية ثم مستوى الصعوبة. لديك 10 ثوانٍ لكل سؤال: كلما أجبت أسرع ربحت نقاطاً أكثر. زر «العب» الكبير يعيد تشغيل آخر لعبة لعبتها."],["Drapeaux, Capitales et Cartes pour reconnaître les pays. Culture pour les monuments, les langues, les pays voisins et la population. Défis pour la survie, le contre-la-montre et le vrai ou faux.","Flags, Capitals and Maps to recognise countries. Culture for landmarks, languages, neighbouring countries and population. Challenges for survival, time attack and true or false.","الأعلام والعواصم والخرائط للتعرّف على الدول. الثقافة للمعالم واللغات والدول المجاورة وعدد السكان. التحديات للبقاء وسباق الوقت وصح أم خطأ."],["Tu as 10 parties offertes chaque jour. Ensuite, une partie coûte 1 gemme. Le défi du jour, la révision et le duel sont toujours gratuits. Tu gagnes des gemmes avec la récompense du jour, le coffre, les badges et les séries.","You get 10 free games every day. After that, a game costs 1 gem. The daily challenge, review and duels are always free. You earn gems with the daily reward, the chest, badges and streaks.","لديك 10 مباريات مجانية كل يوم. بعدها تكلّف المباراة جوهرة واحدة. تحدي اليوم والمراجعة والمبارزة مجانية دائماً. تربح الجواهر من مكافأة اليوم والصندوق والشارات والسلاسل."],["Chaque jeu commence en Facile. Le niveau suivant s’ouvre quand tu as gagné assez d’XP dans ce jeu, ou tout de suite avec des gemmes. La barre sous les niveaux montre où tu en es.","Every game starts on Easy. The next level opens once you have earned enough XP in that game, or right away with gems. The bar under the levels shows your progress.","كل لعبة تبدأ بالمستوى السهل. يُفتح المستوى التالي عندما تربح ما يكفي من نقاط الخبرة في هذه اللعبة، أو فوراً بالجواهر. الشريط تحت المستويات يبيّن تقدمك."],["Pendant une partie : 50/50 retire la moitié des réponses, +5 s ajoute du temps, Passer saute la question. Chaque joker coûte 1 gemme. En Survie, une seconde chance te laisse continuer après une erreur.","During a game: 50/50 removes half of the answers, +5 s adds time, Skip jumps to the next question. Each lifeline costs 1 gem. In Survival, a second chance lets you carry on after a mistake.","أثناء المباراة: 50/50 يحذف نصف الإجابات، +5 ث يضيف وقتاً، «تخطي» ينتقل إلى السؤال التالي. كل وسيلة تكلّف جوهرة واحدة. في وضع البقاء، الفرصة الثانية تتيح لك المتابعة بعد خطأ."],["Récupère ta récompense, joue le défi du jour et termine tes 3 missions pour ouvrir le coffre. Jouer tous les jours fait grandir ta série, qui rapporte des gemmes à 7, 30 et 100 jours.","Collect your reward, play the daily challenge and complete your 3 missions to open the chest. Playing every day grows your streak, which pays gems at 7, 30 and 100 days.","استلم مكافأتك، العب تحدي اليوم وأكمل مهامك الثلاث لفتح الصندوق. اللعب كل يوم يطيل سلسلتك، وهي تمنحك جواهر عند 7 و30 و100 يوم."],["Chaque semaine, tu joues dans une ligue avec d’autres joueurs. Le premier quart monte dans la ligue supérieure, le dernier quart descend. Le week-end, un tournoi récompense les meilleurs.","Each week you play in a league with other players. The top quarter moves up to the next league, the bottom quarter moves down. At the weekend, a tournament rewards the best players.","كل أسبوع تلعب في دوري مع لاعبين آخرين. الربع الأول يصعد إلى الدوري الأعلى والربع الأخير يهبط. في نهاية الأسبوع، بطولة تكافئ الأفضل."],["Les pays que tu rates vont dans Réviser. Un pays est maîtrisé après 3 bonnes réponses et s’ajoute à ton atlas.","The countries you miss go to Review. A country is mastered after 3 correct answers and is added to your atlas.","الدول التي تخطئ فيها تذهب إلى المراجعة. تُتقن الدولة بعد 3 إجابات صحيحة وتُضاف إلى أطلسك."],["Défie un ami avec un code ou lance un défi à tous les joueurs connectés. Crée un groupe pour ta famille ou ta classe : un enseignant peut y donner des devoirs.","Challenge a friend with a code or send a challenge to every player online. Create a group for your family or your class: a teacher can set homework there.","تحدَّ صديقاً برمز أو أرسل تحدياً لكل اللاعبين المتصلين. أنشئ مجموعة لعائلتك أو لصفّك: يستطيع المعلّم أن يعطي فيها واجبات."],["Sans compte, ta progression reste sur cet appareil. Avec un compte, tu la retrouves partout. Pour signaler ou bloquer un joueur, touche son nom dans un classement. Tu peux supprimer ton compte dans Réglages, Mon compte.","Without an account, your progress stays on this device. With an account, you find it everywhere. To report or block a player, tap their name in a leaderboard. You can delete your account in Settings, My account.","بدون حساب يبقى تقدمك على هذا الجهاز. مع حساب تجده في كل مكان. للإبلاغ عن لاعب أو حظره، المس اسمه في الترتيب. يمكنك حذف حسابك من الإعدادات، حسابي."],["Mode d’emploi","User guide","دليل الاستخدام"],["Tout ce qu’il faut savoir pour jouer.","Everything you need to know to play.","كل ما تحتاج معرفته للعب."],["Español","Español","Español"]]);

a la pregunta. Cada comodín cuesta 1 gema. En Supervivencia, una segunda oportunidad te deja seguir tras un error.","Chaque jour":"Cada día","Récupère ta récompense, joue le défi du jour et termine tes 3 missions pour ouvrir le coffre. Jouer tous les jours fait grandir ta série, qui rapporte des gemmes à 7, 30 et 100 jours.":"Recoge tu recompensa, juega el reto del día y completa tus 3 misiones para abrir el cofre. Jugar todos los días hace crecer tu racha, que da gemas a los 7, 30 y 100 días.","Classements et ligues":"Clasificaciones y ligas","Chaque semaine, tu joues dans une ligue avec d’autres joueurs. Le premier quart monte dans la ligue supérieure, le dernier quart descend. Le week-end, un tournoi récompense les meilleurs.":"Cada semana juegas en una liga con otros jugadores. El primer cuarto sube a la liga superior, el último cuarto baja. El fin de semana, un torneo premia a los mejores.","Réviser et Atlas":"Repasar y Atlas","Les pays que tu rates vont dans Réviser. Un pays est maîtrisé après 3 bonnes réponses et s’ajoute à ton atlas.":"Los países que fallas van a Repasar. Un país está dominado tras 3 respuestas correctas y se añade a tu atlas.","Duels, amis et groupes":"Duelos, amigos y grupos","Défie un ami avec un code ou lance un défi à tous les joueurs connectés. Crée un groupe pour ta famille ou ta classe : un enseignant peut y donner des devoirs.":"Reta a un amigo con un código o lanza un reto a todos los jugadores conectados. Crea un grupo para tu familia o tu clase: un profesor puede poner deberes en él.","Compte et sécurité":"Cuenta y seguridad","Sans compte, ta progression reste sur cet appareil. Avec un compte, tu la retrouves partout. Pour signaler ou bloquer un joueur, touche son nom dans un classement. Tu peux supprimer ton compte dans Réglages, Mon compte.":"Sin cuenta, tu progreso se queda en este dispositivo. Con una cuenta, lo recuperas en todas partes. Para denunciar o bloquear a un jugador, toca su nombre en una clasificación. Puedes eliminar tu cuenta en Ajustes, Mi cuenta.","Mode d’emploi":"Guía de uso","Tout ce qu’il faut savoir pour jouer.":"Todo lo que necesitas saber para jugar.","Español":"Español"});

 let w=Math.max((x1-x0)*k*(1+2*pad),minW),h=Math.max((y1-y0)*(1+2*pad),minW*H/W);
 if(w/h<W/H)w=h*W/H;else h=w*H/W;
 if(h>164){h=164;w=h*W/H}
 let b0=cy-h/2,b1=cy+h/2;if(b1>84){b0-=b1-84;b1=84}if(b0<-84){b1+=-84-b0;b0=-84}
 return[cx-w/k/2,b0,cx+w/k/2,b1];
}
const pbb=p=>p.bq||(p.bq=(()=>{let a=1e9,b=1e9,c=-1e9,d=-1e9,w=0;for(const q of p[0]){if(q[0]<a)a=q[0];if(q[0]>c)c=q[0];if(q[1]<b)b=q[1];if(q[1]>d)d=q[1]}if(c-a>180){w=360;a=1e9;c=-1e9;for(const q of p[0]){const u=q[0]<0?q[0]+360:q[0];if(u<a)a=u;if(u>c)c=u}}return[a,b,c,d,ringArea(p[0].map(q=>[q[0]<0?q[0]+w:q[0],q[1]])),w]})());

function landPath(win,W,H,skip,tol){

 let d="",cov=0;
 for(const id in MAPS){if(+id===skip)continue;
  for(const p of MAPS[id]){const g=pbb(p);
   for(const o of sh){if(g[2]+o<l0||g[0]+o>l1||g[3]<b0||g[1]>b1)continue;
    const w=(g[2]-g[0])*sx,h=(g[3]-g[1])*sy;if(w<.8&&h<.8)continue;
    const r=p[0];let s="",lx=1e9,ly=1e9,n=0;
    for(let i=0;i<r.length;i++){const X=Math.max(-40,Math.min(W+40,((r[i][0]<0?r[i][0]+g[5]:r[i][0])+o-l0)*sx)),Y=Math.max(-40,Math.min(H+40,(b1-r[i][1])*sy));if(i&&i<r.length-1&&Math.abs(X-lx)<tol&&Math.abs(Y-ly)<tol)continue;s+=(n?"L":"M")+X.toFixed(1)+" "+Y.toFixed(1);lx=X;ly=Y;n++}
    if(n<3)continue;d+=s+"Z";
    const ox=Math.max(0,Math.min(g[2]+o,l1)-Math.max(g[0]+o,l0))*sx,oy=Math.max(0,Math.min(g[3],b1)-Math.max(g[1],b0))*sy;
    cov+=g[4]*sx*sy*(w*h>0?Math.min(1,ox*oy/(w*h)):1);
   }}}
 return{d,cov};
}

}

  else if(k==="no"){tone(220,0,.22,"sawtooth",.07);tone(165,.1,.25,"sawtooth",.06)}
  else if(k==="end"){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.22,"triangle"))}
  else if(k==="pop"){tone(880,0,.07,"triangle",.07)}
  else if(k==="tick"){tone(740,0,.06,"sine",.09)}
