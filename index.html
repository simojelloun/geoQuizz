<style>

:root[data-visual="glass"] body{background:var(--bg);background-attachment:fixed}

:root[data-visual="sunset"] .card,:root[data-visual="sunset"] .nav,:root[data-visual="sunset"] .opt,:root[data-visual="sunset"] .lvb,:root[data-visual="sunset"] .dz.done,:root[data-visual="sunset"] select,:root[data-visual="sunset"] input{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);box-shadow:0 2px 12px rgba(0,0,0,.2)}

*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
main{max-width:480px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.9rem;line-height:1.15;margin:4px 0 6px;font-weight:700;letter-spacing:-.02em}
h1 span{color:var(--acc)}
.sub{color:var(--mute);margin:0 0 22px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
label{font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);display:block;margin-bottom:10px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvb{padding:11px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:500;font-size:.92rem;transition:.15s}
.lvb small{display:block;font-weight:400;color:#f59e0b;font-size:.75rem;margin-top:2px}
.lvb.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card));color:var(--acc);font-weight:600}.lvb.on small{color:#f59e0b}
.btn{width:100%;padding:14px;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:var(--onacc);font-weight:600;font-size:1rem;margin-top:10px;transition:.15s}
.btn.alt{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn:active{filter:brightness(.92)}
.btn[disabled]{opacity:.45}
.nav{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.nt{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}.nav svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav span{flex:1}.nav .nt{flex:none}.nav b{display:block;font-weight:600;font-size:1.05rem}.nav small{color:var(--mute);font-size:.82rem}
.hd{display:flex;align-items:center;gap:16px;margin:4px 0 18px;padding:18px;border-radius:16px;color:#fff;box-shadow:0 6px 18px -8px rgba(0,0,0,.45)}.hd .nt{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.18)}.hd svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.hd h1{margin:0;color:#fff}.hd h1 span{color:rgba(255,255,255,.7)}.hd .sub{margin:3px 0 0;color:rgba(255,255,255,.88)}
.nav i{color:var(--mute);font-style:normal;font-size:1.4rem}
.nav:active{background:var(--bg)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:500;margin-bottom:10px;font-size:.92rem}
.top b{font-weight:700}
.bar{height:6px;border-radius:6px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .1s linear}
.flag{font-size:7rem;line-height:1.15;text-align:center;padding:22px 0;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:14px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:500;font-size:.98rem;min-height:58px;box-shadow:0 1px 2px rgba(16,24,40,.05);transition:.15s}
.fi{height:.72em;width:auto;max-width:1.7em;vertical-align:-.08em;border-radius:.07em;box-shadow:0 0 0 1px rgba(12,27,46,.12);object-fit:contain}
.flag .fi{height:6rem;max-width:min(78vw,11rem);border-radius:6px;box-shadow:0 6px 18px -8px rgba(12,27,46,.45),0 0 0 1px rgba(12,27,46,.1)}
.opt.fl .fi{height:2.6rem;max-width:4.4rem}
.opt.fl{font-size:3.2rem;line-height:1.2;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no{background:var(--bad);border-color:var(--bad);color:#fff}
.pl{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border:0}.pl b{font-weight:700}.pl .me{color:var(--acc);font-weight:600}
.big{font-size:3.6rem;font-weight:700;text-align:center;line-height:1;color:var(--acc);letter-spacing:-.03em}
.mute{color:var(--mute);font-size:.9rem;text-align:center}
.err{color:var(--bad);font-weight:600;text-align:center;margin:8px 0}
.lvb.md{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px}
.mi{display:inline-flex;align-items:center;gap:1px;padding:7px 8px;border-radius:11px;flex:none;box-shadow:0 2px 6px -2px rgba(0,0,0,.35)}
.mi svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb{display:flex;justify-content:flex-end;margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:3px}
.seg button{width:36px;height:30px;border:0;background:transparent;border-radius:999px;display:grid;place-items:center;color:var(--mute)}
.seg button.on{background:var(--acc);color:var(--onacc)}
.seg svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lvl{display:flex;flex-direction:column;gap:8px}
.lr{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);transition:.15s}
.lr.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--card))}
.bars{display:flex;align-items:flex-end;gap:3px;height:22px;flex:none}
.bars i{width:5px;border-radius:2px;background:var(--line)}
.bars i:nth-child(1){height:7px}.bars i:nth-child(2){height:12px}.bars i:nth-child(3){height:17px}.bars i:nth-child(4){height:22px}
.lt{flex:1}.lt b{display:block;font-weight:600}.lt small{color:var(--mute);font-size:.8rem}
.cf{font-weight:700;font-size:.82rem;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.lr.on .cf{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
select{width:100%;font:inherit;font-size:1rem;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
.lk{border:0;background:none;color:var(--acc);font:inherit;padding:0;text-decoration:underline}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.fx i{position:absolute;top:-24px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .6s ease-out}
.badge{display:table;margin:0 auto 12px;padding:5px 14px;border-radius:999px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;font-weight:700;font-size:.8rem;letter-spacing:.04em;animation:pop .5s .15s both}
@media (prefers-reduced-motion:reduce){.pop,.badge{animation:none}}
.opt.mp{padding:4px;overflow:hidden;border-radius:12px}.opt.mp svg{pointer-events:none;border-radius:8px}.opt.mp.ok svg .tg{fill:#fff;stroke:#fff}.opt.mp.ok svg .nb{fill:rgba(255,255,255,.18);stroke:rgba(255,255,255,.35)}.opt.mp.ok svg rect{fill:var(--ok)}.opt.mp.no svg .tg{fill:#fff;stroke:#fff}.opt.mp.no svg .nb{fill:rgba(255,255,255,.18);stroke:rgba(255,255,255,.35)}.opt.mp.no svg rect{fill:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px;z-index:40}
.ov .card{max-width:360px;width:100%;margin:0;text-align:center}
.lvl{gap:6px}
.lr{gap:10px;padding:7px 10px;border-radius:10px}
.bars{height:16px;gap:2px}.bars i{width:4px}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:12px}.bars i:nth-child(4){height:16px}
.lt b{font-size:.9rem}.lt small{font-size:.72rem}
.cf{font-size:.75rem;padding:2px 8px}
.lvl{flex-direction:row;gap:6px}
.lr{flex:1;min-width:0;flex-direction:column;justify-content:flex-start;align-items:center;gap:5px;padding:9px 2px;text-align:center}
.lt{flex:none}.lt b{font-size:.76rem;line-height:1.15}.lt small{display:none}

/* ===== Atlas ===== */
:root{--bg:#eef4f8;--card:#fff;--ink:#0c1b2e;--mute:#5b6b7d;--acc:#0b5cad;--acc2:#12a594;--sun:#ffb703;--onacc:#fff;--ok:#12a150;--bad:#e5484d;--line:#d6e1eb;--edge:#c3d2e0;--grid:rgba(11,92,173,.07);--pass:#0b3c6f;--D:'Bricolage Grotesque','DM Sans','IBM Plex Sans Arabic',system-ui,sans-serif}
:root[data-theme="dark"]{--bg:#081726;--card:#0f2438;--ink:#e9f0f7;--mute:#8ea2b8;--acc:#4da3ff;--acc2:#2fd0bd;--onacc:#06121f;--ok:#2fb36a;--bad:#f2555a;--line:#1d3550;--edge:#0a1a2b;--grid:rgba(77,163,255,.07);--pass:#123e6b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081726;--card:#0f2438;--ink:#e9f0f7;--mute:#8ea2b8;--acc:#4da3ff;--acc2:#2fd0bd;--onacc:#06121f;--ok:#2fb36a;--bad:#f2555a;--line:#1d3550;--edge:#0a1a2b;--grid:rgba(77,163,255,.07);--pass:#123e6b}}
body{font-family:'DM Sans','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 44px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/44px 100%,var(--bg);background-attachment:fixed}
h1{font-family:var(--D);font-weight:800;font-size:2.1rem;letter-spacing:-.03em}
h1 span{color:var(--sun)}
label{text-transform:none;letter-spacing:0;font-size:.85rem}
.card{border-radius:16px;box-shadow:0 3px 0 var(--edge)}
.btn{font-family:var(--D);border:0;border-radius:12px;font-weight:800;font-size:1.05rem;box-shadow:0 4px 0 color-mix(in srgb,var(--acc) 62%,#000);transition:transform .08s,box-shadow .08s}
.btn:active{filter:none;transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--acc) 62%,#000)}
.btn.alt{border:1px solid var(--line);box-shadow:0 4px 0 var(--edge);font-weight:600}
.btn.alt:active{box-shadow:0 1px 0 var(--edge)}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,.nav:focus-visible,.dz:focus-visible,.lr:focus-visible,.lvb:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hb{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.hb h1{margin:0}
.pc{display:flex;gap:16px;align-items:center;background:var(--pass);color:#fff;border:0;position:relative;padding:20px}
.pc:before{content:"";position:absolute;inset:7px;border:1px dashed rgba(255,255,255,.28);border-radius:10px;pointer-events:none}
.stamp{width:68px;height:68px;border-radius:50%;border:2.5px solid var(--sun);outline:1px solid var(--sun);outline-offset:3px;color:var(--sun);display:grid;place-items:center;text-align:center;transform:rotate(-9deg);flex:none;font:800 1.7rem/1 var(--D)}
.stamp small{display:block;font:700 .5rem/1.4 'DM Sans',sans-serif;letter-spacing:.14em}
.pi{flex:1;min-width:0}.pn{font:800 1.25rem/1.2 var(--D);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pt{font-size:.85rem;opacity:.85}
.pc .lk{color:#fff;opacity:.75;font:500 .75rem 'DM Sans','IBM Plex Sans Arabic',sans-serif;margin-inline-start:8px}
.xp{height:8px;border-radius:8px;background:rgba(255,255,255,.2);margin:9px 0 5px;overflow:hidden}.xp i{display:block;height:100%;background:var(--sun);border-radius:8px}
.px{font-size:.74rem;opacity:.85;display:flex;justify-content:space-between;gap:8px}
.strk{display:flex;align-items:center;gap:8px;margin:0 2px 14px;font-size:.88rem;color:var(--mute)}
.strk svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.strk.on{color:var(--ink)}.strk.on svg{stroke:#e8590c;fill:#ffb703}
.dz{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;margin-bottom:18px;border:0;border-radius:16px;background:var(--sun);color:#2b1d00;box-shadow:0 4px 0 #c98f00;transition:transform .08s,box-shadow .08s}
.dz:active{transform:translateY(3px);box-shadow:0 1px 0 #c98f00}
.dz span{flex:1}.dz b{display:block;font:800 1.15rem/1.2 var(--D)}.dz small{font-size:.82rem;opacity:.85}
.dz em{font:800 .9rem var(--D);font-style:normal;background:#2b1d00;color:var(--sun);padding:8px 14px;border-radius:999px;flex:none}
.dz.done{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--edge);border:1px solid var(--line)}.dz.done em{background:var(--bg);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{display:block;text-align:left;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.tile .nt{margin-bottom:12px}.tile svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font:800 1.15rem/1.2 var(--D)}.tile small{color:var(--mute);font-size:.82rem}
.nav{border-radius:16px;box-shadow:0 4px 0 var(--edge);transition:transform .08s,box-shadow .08s}.nav .nt{flex:none}.nav b{font-family:var(--D);font-weight:800}
.nav:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge);background:var(--card)}
.hd{box-shadow:0 4px 0 rgba(0,0,0,.18)}
.lr,.lvb{border-radius:12px}

r du jeu. Tu ne peux plus jouer ni apparaître dans les classements avec ce compte.", "This account has been suspended by the game’s administrator. You can no longer play or appear on leaderboards with this account.", "أوقف مشرف اللعبة هذا الحساب. لم يعد بإمكانك اللعب أو الظهور في الترتيب بهذا الحساب."], ["Supprimer mon compte", "Delete my account", "حذف حسابي"], ["Supprimer définitivement", "Delete permanently", "حذف نهائي"], ["Ton pseudo, ton email, tes scores, tes gemmes et tes badges seront effacés définitivement. Cette action ne peut pas être annulée.", "Your username, email, scores, gems and badges will be permanently erased. This cannot be undone.", "سيُمسح اسمك وبريدك ونتائجك وجواهرك وشاراتك نهائيًا. لا يمكن التراجع عن هذا الإجراء."], ["Ton compte a été supprimé.", "Your account has been deleted.", "تم حذف حسابك."], ["Ce que le jeu enregistre", "What the game stores", "ما الذي تحفظه اللعبة"], ["Ton pseudo, ton email, tes scores, ta progression (niveau, gemmes, badges, série) et le nombre de parties que tu joues chaque jour.", "Your username, your email, your scores, your progress (level, gems, badges, streak) and the number of games you play each day.", "اسمك وبريدك ونتائجك وتقدمك (المستوى، الجواهر، الشارات، السلسلة) وعدد المباريات التي تلعبها كل يوم."], ["Ton pseudo, tes scores et ta progression, uniquement sur cet appareil.", "Your username, scores and progress, on this device only.", "اسمك ونتائجك وتقدمك، على هذا الجهاز فقط."], ["Tes réglages (langue, sons, apparence) restent sur ton appareil.", "Your settings (language, sounds, appearance) stay on your device.", "إعداداتك (اللغة، الأصوات، المظهر) تبقى على جهازك."], ["Qui voit quoi", "Who sees what", "من يرى ماذا"], ["Les autres joueurs voient ton pseudo, ton niveau et tes scores dans les classements.", "Other players see your username, level and scores on leaderboards.", "يرى اللاعبون الآخرون اسمك ومستواك ونتائجك في الترتيب."], ["Ton email n’est jamais affiché. Il sert à te connecter et à vérifier ton compte.", "Your email is never shown. It is used to sign you in and verify your account.", "بريدك لا يُعرض أبدًا. يُستخدم لتسجيل دخولك والتحقق من حسابك."], ["L’administrateur du jeu voit aussi tes statistiques de jeu, pas ton mot de passe.", "The game’s administrator also sees your play statistics, not your password.", "يرى مشرف اللعبة أيضًا إحصاءات لعبك، وليس كلمة مرورك."], ["Où sont les données", "Where the data is kept", "أين تُحفظ البيانات"], ["Elles sont stockées chez Firebase (Google), sur des serveurs situés en Europe.", "It is stored with Firebase (Google), on servers located in Europe.", "تُخزَّن لدى Firebase (Google) على خوادم في أوروبا."], ["Le jeu ne contient ni publicité ni traceur publicitaire.", "The game contains no ads and no ad trackers.", "اللعبة لا تحتوي على إعلانات ولا على أدوات تتبع إعلانية."], ["Services externes", "External services", "خدمات خارجية"], ["Les drapeaux, les photos de monuments, les cartes et les polices sont chargés depuis flagcdn.com, Wikimedia Commons, jsDelivr et Google Fonts. Comme pour tout site web, ces services reçoivent l’adresse IP de ton appareil.", "Flags, landmark photos, maps and fonts are loaded from flagcdn.com, Wikimedia Commons, jsDelivr and Google Fonts. As with any website, these services receive your device’s IP address.", "تُحمَّل الأعلام وصور المعالم والخرائط والخطوط من flagcdn.com وWikimedia Commons وjsDelivr وGoogle Fonts. وكما في أي موقع، تتلقى هذه الخدمات عنوان IP لجهازك."], ["Tes droits", "Your rights", "حقوقك"], ["Tu peux supprimer ton compte et toutes tes données à tout moment, depuis « Mon compte ».", "You can delete your account and all your data at any time, from “My account”.", "يمكنك حذف حسابك وكل بياناتك في أي وقت من «حسابي»."], ["Tu peux effacer tes données en vidant les données du site dans ton navigateur.", "You can erase your data by clearing this site’s data in your browser.", "يمكنك مسح بياناتك بحذف بيانات الموقع من متصفحك."], ["Si tu as moins de 15 ans, demande l’accord d’un parent avant de addTr([["Jouer une partie","Playing a game","لعب مباراة"],["Les jeux","The games","الألعاب"],["Parties offertes et gemmes","Free games and gems","المباريات المجانية والجواهر"],["Niveaux de difficulté","Difficulty levels","مستويات الصعوبة"],["Les jokers","Lifelines","وسائل المساعدة"],["Chaque jour","Every day","كل يوم"],["Classements et ligues","Leaderboards and leagues","الترتيب والدوريات"],["Réviser et Atlas","Review and Atlas","المراجعة والأطلس"],["Duels, amis et groupes","Duels, friends and groups","المبارزات والأصدقاء والمجموعات"],["Compte et sécurité","Account and safety","الحساب والأمان"],["Choisis un jeu sur l’accueil, puis une difficulté. Tu as 10 secondes par question : plus tu réponds vite, plus tu marques de points. Le grand bouton Jouer relance ton dernier jeu.","Pick a game on the home screen, then a difficulty. You have 10 seconds per question: the faster you answer, the more points you score. The big Play button restarts your last game.","اختر لعبة من الصفحة الرئيسية ثم مستوى الصعوبة. لديك 10 ثوانٍ لكل سؤال: كلما أجبت أسرع ربحت نقاطاً أكثر. زر «العب» الكبير يعيد تشغيل آخر لعبة لعبتها."],["Drapeaux, Capitales et Cartes pour reconnaître les pays. Culture pour les monuments, les langues, les pays voisins et la population. Défis pour la survie, le contre-la-montre et le vrai ou faux.","Flags, Capitals and Maps to recognise countries. Culture for landmarks, languages, neighbouring countries and population. Challenges for survival, time attack and true or false.","الأعلام والعواصم والخرائط للتعرّف على الدول. الثقافة للمعالم واللغات والدول المجاورة وعدد السكان. التحديات للبقاء وسباق الوقت وصح أم خطأ."],["Tu as 10 parties offertes chaque jour. Ensuite, une partie coûte 1 gemme. Le défi du jour, la révision et le duel sont toujours gratuits. Tu gagnes des gemmes avec la récompense du jour, le coffre, les badges et les séries.","You get 10 free games every day. After that, a game costs 1 gem. The daily challenge, review and duels are always free. You earn gems with the daily reward, the chest, badges and streaks.","لديك 10 مباريات مجانية كل يوم. بعدها تكلّف المباراة جوهرة واحدة. تحدي اليوم والمراجعة والمبارزة مجانية دائماً. تربح الجواهر من مكافأة اليوم والصندوق والشارات والسلاسل."],["Chaque jeu commence en Facile. Le niveau suivant s’ouvre quand tu as gagné assez d’XP dans ce jeu, ou tout de suite avec des gemmes. La barre sous les niveaux montre où tu en es.","Every game starts on Easy. The next level opens once you have earned enough XP in that game, or right away with gems. The bar under the levels shows your progress.","كل لعبة تبدأ بالمستوى السهل. يُفتح المستوى التالي عندما تربح ما يكفي من نقاط الخبرة في هذه اللعبة، أو فوراً بالجواهر. الشريط تحت المستويات يبيّن تقدمك."],["Pendant une partie : 50/50 retire la moitié des réponses, +5 s ajoute du temps, Passer saute la question. Chaque joker coûte 1 gemme. En Survie, une seconde chance te laisse continuer après une erreur.","During a game: 50/50 removes half of the answers, +5 s adds time, Skip jumps to the next question. Each lifeline costs 1 gem. In Survival, a second chance lets you carry on after a mistake.","أثناء المباراة: 50/50 يحذف نصف الإجابات، +5 ث يضيف وقتاً، «تخطي» ينتقل إلى السؤال التالي. كل وسيلة تكلّف جوهرة واحدة. في وضع البقاء، الفرصة الثانية تتيح لك المتابعة بعد خطأ."],["Récupère ta récompense, joue le défi du jour et termine tes 3 missions pour ouvrir le coffre. Jouer tous les jours fait grandir ta série, qui rapporte des gemmes à 7, 30 et 100 jours.","Collect your reward, play the daily challenge and complete your 3 missions to open the chest. Playing every day grows your streak, which pays gems at 7, 30 and 100 days.","استلم مكافأتك، العب تحدي اليوم وأكمل مهامك الثلاث لفتح الصندوق. اللعب كل يوم يطيل سلسلتك، وهي تمنحك جواهر عند 7 و30 و100 يوم."],["Chaque semaine, tu joues dans une ligue avec d’autres joueurs. Le premier quart monte dans la ligue supérieure, le dernier quart descend. Le week-end, un tournoi récompense les meilleurs.","Each week you play in a league with other players. The top quarter moves up to the next league, the bottom quarter moves down. At the weekend, a tournament rewards the best players.","كل أسبوع تلعب في دوري مع لاعبين آخرين. الربع الأول يصعد إلى الدوري الأعلى والربع الأخير يهبط. في نهاية الأسبوع، بطولة تكافئ الأفضل."],["Les pays que tu rates vont dans Réviser. Un pays est maîtrisé après 3 bonnes réponses et s’ajoute à ton atlas.","The countries you miss go to Review. A country is mastered after 3 correct answers and is added to your atlas.","الدول التي تخطئ فيها تذهب إلى المراجعة. تُتقن الدولة بعد 3 إجابات صحيحة وتُضاف إلى أطلسك."],["Défie un ami avec un code ou lance un défi à tous les joueurs connectés. Crée un groupe pour ta famille ou ta classe : un enseignant peut y donner des devoirs.","Challenge a friend with a code or send a challenge to every player online. Create a group for your family or your class: a teacher can set homework there.","تحدَّ صديقاً برمز أو أرسل تحدياً لكل اللاعبين المتصلين. أنشئ مجموعة لعائلتك أو لصفّك: يستطيع المعلّم أن يعطي فيها واجبات."],["Sans compte, ta progression reste sur cet appareil. Avec un compte, tu la retrouves partout. Pour signaler ou bloquer un joueur, touche son nom dans un classement. Tu peux supprimer ton compte dans Réglages, Mon compte.","Without an account, your progress stays on this device. With an account, you find it everywhere. To report or block a player, tap their name in a leaderboard. You can delete your account in Settings, My account.","بدون حساب يبقى تقدمك على هذا الجهاز. مع حساب تجده في كل مكان. للإبلاغ عن لاعب أو حظره، المس اسمه في الترتيب. يمكنك حذف حسابك من الإعدادات، حسابي."],["Mode d’emploi","User guide","دليل الاستخدام"],["Tout ce qu’il faut savoir pour jouer.","Everything you need to know to play.","كل ما تحتاج معرفته للعب."],["Español","Español","Español"]]);

sur l’accueil, puis une difficulté. Tu as 10 secondes par question : plus tu réponds vite, plus tu marques de points. Le grand bouton Jouer relance ton dernier jeu.":"Elige un juego en el inicio y después una dificultad. Tienes 10 segundos por pregunta: cuanto más rápido respondes, más puntos consigues. El botón grande Jugar vuelve a lanzar tu último juego.","Les jeux":"Los juegos","Drapeaux, Capitales et Cartes pour reconnaître les pays. Culture pour les monuments, les langues, les pays voisins et la population. Défis pour la survie, le contre-la-montre et le vrai ou faux.":"Banderas, Capitales y Mapas para reconocer los países. Cultura para los monumentos, los idiomas, los países vecinos y la población. Retos para la supervivencia, la contrarreloj y el verdadero o falso.","Parties offertes et gemmes":"Partidas gratis y gemas","Tu as 10 parties offertes chaque jour. Ensuite, une partie coûte 1 gemme. Le défi du jour, la révision et le duel sont toujours gratuits. Tu gagnes des gemmes avec la récompense du jour, le coffre, les badges et les séries.":"Tienes 10 partidas gratis cada día. Después, una partida cuesta 1 gema. El reto del día, el repaso y el duelo son siempre gratis. Ganas gemas con la recompensa del día, el cofre, las insignias y las rachas.","Niveaux de difficulté":"Niveles de dificultad","Chaque jeu commence en Facile. Le niveau suivant s’ouvre quand tu as gagné assez d’XP dans ce jeu, ou tout de suite avec des gemmes. La barre sous les niveaux montre où tu en es.":"Cada juego empieza en Fácil. El nivel siguiente se abre cuando has ganado suficiente XP en ese juego, o al momento con gemas. La barra bajo los niveles muestra cómo vas.","Les jokers":"Los comodines","Pendant une partie : 50/50 retire la moitié des réponses, +5 s ajoute du temps, Passer saute la question. Chaque joker coûte 1 gemme. En Survie, une seconde chance te laisse continuer après une erreur.":"Durante una partida: 50/50 quita la mitad de las respuestas, +5 s añade tiempo, Pasar salta la pregunta. Cada comodín cuesta 1 gema. En Supervivencia, una segunda oportunidad te deja seguir tras un error.","Chaque jour":"Cada día","Récupère ta récompense, joue le défi du jour et termine tes 3 missions pour ouvrir le coffre. Jouer tous les jours fait grandir ta série, qui rapporte des gemmes à 7, 30 et 100 jours.":"Recoge tu recompensa, juega el reto del día y completa tus 3 misiones para abrir el cofre. Jugar todos los días hace crecer tu racha, que da gemas a los 7, 30 y 100 días.","Classements et ligues":"Clasificaciones y ligas","Chaque semaine, tu joues dans une ligue avec d’autres joueurs. Le premier quart monte dans la ligue supérieure, le dernier quart descend. Le week-end, un tournoi récompense les meilleurs.":"Cada semana juegas en una liga con otros jugadores. El primer cuarto sube a la liga superior, el último cuarto baja. El fin de semana, un torneo premia a los mejores.","Réviser et Atlas":"Repasar y Atlas","Les pays que tu rates vont dans Réviser. Un pays est maîtrisé après 3 bonnes réponses et s’ajoute à ton atlas.":"Los países que fallas van a Repasar. Un país está dominado tras 3 respuestas correctas y se añade a tu atlas.","Duels, amis et groupes":"Duelos, amigos y grupos","Défie un ami avec un code ou lance un défi à tous les joueurs connectés. Crée un groupe pour ta famille ou ta classe : un enseignant peut y donner des devoirs.":"Reta a un amigo con un código o lanza un reto a todos los jugadores conectados. Crea un grupo para tu familia o tu clase: un profesor puede poner deberes en él.","Compte et sécurité":"Cuenta y seguridad","Sans compte, ta progression reste sur cet appareil. Avec un compte, tu la retrouves partout. Pour signaler ou bloquer un joueur, touche son nom dans un classement. Tu peux supprimer ton compte dans Réglages, Mon compte.":"Sin cuenta, tu progreso se queda en este dispositivo. Con una cuenta, lo recuperas en todas partes. Para denunciar o bloquear a un jugador, toca su nombre en una clasificación. Puedes eliminar tu cuenta en Ajustes, Mi cuenta.","Mode d’emploi":"Guía de uso","Tout ce qu’il faut savoir pour jouer.":"Todo lo que necesitas saber para jugar.","Español":"Español"});

function comboFx(n){try{const e=document.createElement("div");e.className="cmb";e.setAttribute("aria-hidden","true");e.innerHTML=sv("fire")+"<b></b>";e.lastChild.textContent=tr(`${n} à la suite !`);document.body.appendChild(e);setTimeout(()=>e.remove(),1150);setTimeout(()=>{buzz(30);if(S.snd&&AC)try{tone(784,0,.09,"triangle",.09);tone(1175,.07,.14,"triangle",.09)}catch(e){}},150)}catch(e){}}
function fb(good){sfx(good?"ok":"no");buzz(good?15:[40,40,60])}
const isRec=()=>S.uid?!!(S.res&&S.res.rec):!!S.sessRec;
function confetti(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const cols=["#2563eb","#f59e0b","#10b981","#ef4444","#7c3aed","#ec4899"],box=document.createElement("div");
 box.className="fx";
 for(let i=0;i<46;i++){const p=document.createElement("i");p.style.cssText=`left:${Math.random()*100}%;background:${cols[i%6]};width:${6+Math.random()*6}px;height:${10+Math.random()*8}px;animation-delay:${Math.random()*.5}s;animation-duration:${1.8+Math.random()*1.4}s;--dx:${(Math.random()-.5)*160}px`;box.appendChild(p)}
 document.body.appendChild(box);setTimeout(()=>box.remove(),3600);
}
async function finish(){clearInterval(S.t);S.fx=0;S.er=0;S.ovT=0;S.view="end";S.res=null;S.st=null;if(S.mode==="duel")return duelFinish();end();const g=S.gid;S.res=await save();if(S.view!=="end"||g!==S.gid)return;if(S.res&&S.res.nb&&S.res.nb.length)sfx("badge");else if(S.mode!=="rev")sfx("end");end();if(S.mode==="rev"||S.special||!S.res||!S.res.best)return;S.st=await standing();if(S.view==="end"&&g===S.gid)end()}
function stars(){const g=S.good||0,n=S.qs.length;return S.mode==="surv"?(g>=20?3:g>=10?2:g>=5?1:0):S.mode==="chr"?(g>=25?3:g>=15?2:g>=8?1:0):(g>=n*.9?3:g>=n*.6?2:g>=n*.3?1:0)}
const badgeCard=nb=>{if(!nb||!nb.length)return"";const top={};nb.forEach(id=>{const b=BADGES.find(x=>x[0]===id);if(b&&(!top[b[6]]||top[b[6]][5]<b[5]))top[b[6]]=b});
 return `<div class="card nbd">${Object.values(top).map(b=>`<div class="bdg on" style="--bc:${b[4]}"><span>${sv("medal")}</span><div><b>Badge obtenu : ${esc(b[1])}</b><small>${esc(b[2])}</small>${bstars(b[5])}</div></div>`).join("")}</div>`};
function endRev(){
 const left=((S.me&&S.me.rv)||[]).length,r=S.res&&S.res.best!==undefined?S.res:null;
 app.innerHTML=`<h1>Révision terminée<span>.</span></h1><p class="sub">${S.good} bonne${S.good>1?"s":""} réponse${S.good>1?"s":""} sur ${S.i+(S.locked?1:0)}.</p>
 <div class="card" style="text-align:center"><div class="stats"><div class="st"><b>${S.mast.length}</b><small>pays maîtrisés</small></div><div class="st"><b>${S.miss.length}</b><small>encore ratés</small></div><div class="st"><b>${r?left:"…"}</b><small>à revoir en tout</small></div></div>
 ${r?`<p class="mute" style="margin:12px 0 0">+${xpg(S.score)} XP</p>`:S.res==="err"||S.res==="queued"?`<p class="mute" style="margin:12px 0 0">Hors connexion : la révision sera enregistrée au retour d’internet.</p>`:`<p class="mute" style="margin:12px 0 0">Enregistrement…</p>`}</div>
 ${r?tkLine(r)+badgeCard(r.nb):""}${r&&r.ev?evEnd(r.ev):""}
 ${r&&left?`<button class="btn" id="again">Continuer à réviser</button>`:""}<button class="btn alt" id="hm">Accueil</button>`;
 const ag=$("again");if(ag)ag.onclick=startRev;$("hm").onclick=()=>{S.view="home";home()};
}
function end(){
 if(S.mode==="rev")return endRev();
 const r=S.res&&S.res.best!==undefined?S.res:null,long=S.mode==="surv"||S.mode==="chr",day=S.mode==="day",sn=stars(),d=S.me||{},x=+d.x||0,L=lvlOf(x),a=lvlAt(L),b=lvlAt(L+1),st=S.st,sk=streakOf(d),first=!S.er,unl=r&&r.lvNew?[r.lvNew]:[];S.er=1;
 app.innerHTML=`<h1>${sn===3?"Bravo":"Terminé"}<span>.</span></h1><p class="sub">${S.special==="tn"?"Tournoi du week-end":S.special==="hw"?"Devoir · "+(MODES[S.mode]||""):KL(SK())}${day?"":" · "+LV[S.lv].n}</p>
 <div class="card" style="text-align:center">${r&&r.rec?(st&&st.newAbs?`<div class="trf"><span class="trc">${sv("trophy")}</span><b>Nouveau record absolu</b><small>Tu détiens le meilleur score de ce jeu.</small></div>`:`<div class="badge">Nouveau record</div>`):""}<div class="stars ${first?"seq":""}" role="img" aria-label="${sn} étoiles sur 3">${[1,2,3].map(i=>`<svg viewBox="0 0 24 24" class="${i<=sn?"on":""}">${P.star}</svg>`).join("")}</div><div class="big ${first?"pop":""}">${fmt(S.score)}</div><p class="mute" style="margin:2px 0 14px">points</p>
 <div class="stats"><div class="st"><b>${S.good}${long?"":"/"+S.qs.length}</b><small>bonnes réponses</small></div><div class="st"><b>${S.maxCombo||0}</b><small>à la suite</small></div><div class="st"><b>${r&&!day&&!S.special?fmt(r.best):"+"+fmt(S.score)}</b><small>${r&&!day&&!S.special?"mon record":"XP gagnés"}</small></div></div>
 ${r?"":S.res==="queued"?`<p class="mute" style="margin:12px 0 0">Hors connexion : ton score sera enregistré dès le retour d’internet.</p>`:S.res==="err"?`<p class="err">Score non enregistré. Vérifie ta connexion puis rejoue.</p>`:`<p class="mute" style="margin:12px 0 0">Enregistrement…</p>`}</div>
 ${r?tkLine(r)+badgeCard(r.nb):""}${r&&r.ev?evEnd(r.ev):""}
 ${r&&(+d.p||0)===1?`<div class="card fgt"><b class="h3">Comment ça marche</b><p>${sv("bolt")}<span>${ENTXT()}</span></p><p>${sv("star")}<span>Tes points deviennent de l’XP : dans chaque jeu, elle ouvre les difficultés plus dures.</span></p></div>`:""}
 ${r?`<div class="card"><div class="top"><span><b>Niveau ${L}</b> · ${titleOf(L)}</span><span class="mute" style="font-size:.82rem">+${xpg(S.score)} XP</span></div><div class="bar"><i style="width:${Math.round((x-a)/(b-a)*100)}%"></i></div><p class="mute" style="text-align:left;margin:8px 0 0">${r.lvUp?`<b class="up">Niveau ${L} atteint.</b> `:""}Encore ${fmt(xpn(b)-xpn(x))} XP pour le niveau ${L+1}.</p></div>
 <p class="strk on">${sv("fire")}<span>Série de ${pl(sk,"jour","jours")}. Reviens demain pour la prolonger.</span></p>`:""}
 ${unl.length?`<div class="card msg act"><b>Difficulté débloquée : ${LV[unl[unl.length-1]].n}</b><small>Tu as atteint ${xpf(LVG[unl[unl.length-1]])} XP dans ce jeu.</small></div>`:""}
 ${st?`<div class="card"><b>${st.pos}${st.pos===1?"er":"e"} sur ${st.n}</b> dans ce classement. ${st.up?`Encore ${fmt(st.up.s-(day?S.score:r?r.best:S.score)+1)} pts pour dépasser ${NM(st.up.n)}.`:"Personne devant toi."}${st.passed&&st.passed.length?`<span class="ovl">${ovTxt(st.passed)}</span>`:""}</div>`:""}

 ${S.miss.length?`<details class="card rv"><summary>À revoir : ${pl(S.miss.length,"pays","pays")} (ajoutés à ta révision)</summary>${S.miss.map(c=>`<div class="pl tap" data-fc="${c.c}"><span>${flag(c.c)} ${esc(c.n)}</span><b>${c.k?esc(c.k)+" · ":""}${esc(ZONES[ZN[c.c]])}</b></div>`).join("")}</details>`:""}
 ${S.special==="tn"?`${tnOn()&&tnLeft()>0?`<button class="btn" id="tna">Nouvel essai (encore ${tnLeft()})</button>`:""}<button class="btn alt" id="rk">Voir le classement du tournoi</button>`:S.special==="hw"?`<div class="card msg"><b>Devoir rendu</b><small>Ton professeur voit ton résultat.</small></div>`:day?`${r&&S.marks&&S.marks.length?`<button class="btn" id="dsh">Partager mon résultat</button>`:""}<button class="btn alt" id="rk">Voir le classement du jour</button>`:`<button class="btn" id="again">Rejouer</button>${sn===3&&S.lv<5&&lvOpen(S.lv+1)?`<button class="btn alt" id="up">Passer en ${LV[S.lv+1].n}</button>`:""}<button class="btn alt" id="rk">Voir le classement</button>`}<button class="btn alt" id="hm">Accueil</button>`;
 if(r&&(r.rec||r.lvUp||(r.nb&&r.nb.length))&&!S.fx){S.fx=1;confetti()}
 if(S.res&&S.res.sg&&!S.sgT){S.sgT=1;setTimeout(()=>toast(tr(`Série de ${S.res.sk} jours : +${S.res.sg} ${S.res.sg>1?"gemmes":"gemme"}`),"good"),900)}if(st&&!S.ovT){S.ovT=1;if(st.newAbs){toast(tr("Nouveau record absolu"),"lead");confetti()}else if(st.passed&&st.passed.length)toast(tr(st.passed.length>1?`Tu viens de dépasser ${st.passed.length} joueurs`:`Tu viens de dépasser ${st.passed[0].n}`),"lead")}
 app.querySelectorAll("[data-fc]").forEach(b=>b.onclick=()=>fiche(b.dataset.fc,()=>{S.view="end";end()}));
 const ag=$("again"),up=$("up");
 if(ag)ag.onclick=()=>start(Date.now()%2147483647,S.lv);
 if(up)up.onclick=()=>start(Date.now()%2147483647,S.lv+1);
 if($("dsh"))$("dsh").onclick=e=>shareDay(e.currentTarget);
 if($("tna"))$("tna").onclick=tnStart;if($("rk"))$("rk").onclick=()=>{S.board=S.special==="tn"?"tn":SK();rank()};$("hm").onclick=()=>{S.view="home";home()};
}
musicStart();
boot();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
