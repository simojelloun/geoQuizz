<title>Geo Quizz</title>

<style>

:root[data-theme="dark"]{--bg:#0e1116;--card:#161a22;--ink:#e8eaed;--mute:#8b93a1;--acc:#4c8bf5;--onacc:#0b1220;--ok:#2fb36a;--bad:#e5534b;--line:#262c38;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}

.btn.alt{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn:active{filter:brightness(.92)}
.btn[disabled]{opacity:.45}

.top b{font-weight:700}

.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .1s linear}
.flag{font-size:7rem;line-height:1.15;text-align:center;padding:22px 0;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.lr.on .cf{background:var(--acc);border-color:var(--acc);color:var(--onacc)}

.lk{border:0;background:none;color:var(--acc);font:inherit;padding:0;text-decoration:underline}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.fx i{position:absolute;top:-24px;border-radius:2px;animation:fall linear forwards}

.pop{animation:pop .6s ease-out}

.lt b{font-size:.9rem}.lt small{font-size:.72rem}
.cf{font-size:.75rem;padding:2px 8px}
.lvl{flex-direction:row;gap:6px}
.lr{flex:1;min-width:0;flex-direction:column;justify-content:flex-start;align-items:center;gap:5px;padding:9px 2px;text-align:center}
.lt{flex:none}.lt b{font-size:.76rem;line-height:1.15}.lt small{display:none}

 if(ctx){
  const m=10,wx0=x0-(ox+m)/sc,wx1=x1+(W-ox-(x1-x0)*sc+m)/sc,wy0=y0-(oy+m)/sc,wy1=y1+(H-oy-(y1-y0)*sc+m)/sc;
  const bbx=p=>p.bb||(p.bb=(()=>{let a=1e9,b=1e9,c=-1e9,d=-1e9;p[0].forEach(q=>{a=Math.min(a,q[0]);c=Math.max(c,q[0]);b=Math.min(b,q[1]);d=Math.max(d,q[1])});return[a*R,my(d),c*R,my(b)]})());
  Object.keys(MAPS).forEach(id=>{
   if(+id===x.n3)return;
   MAPS[id].forEach(p=>{
    const g=bbx(p);
    if(g[2]<wx0||g[0]>wx1||g[3]<wy0||g[1]>wy1)return;
    const r=p[0],st=r.length>200?3:1,pts=[];
    for(let i=0;i<r.length;i+=st)pts.push(P(r[i]));
    nb+="M"+pts.map(q=>q[0].toFixed(1)+" "+q[1].toFixed(1)).join("L")+"Z";
   });
  });
 }
 return MC[key]=`<svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;max-height:${th?96:230}px" role="img" aria-label="Carte du pays à deviner">${nb?`<path class="nb" d="${nb}" fill="var(--line)" stroke="var(--mute)" stroke-width=".5" stroke-linejoin="round"/>`:""}<path class="tg" d="${d}" fill="var(--acc)" fill-rule="evenodd" stroke="var(--acc)" stroke-width=".6" stroke-linejoin="round"/></svg>`;
}
async function start(seed,lv){
 if(S.mode==="cm"&&!MAPS){
  S.view="load";app.innerHTML=`<div class="card"><p class="mute">Chargement des cartes…</p></div>`;
  if(!await loadMap()){
   app.innerHTML=`<h1>Cartes<span>.</span></h1><div class="card"><p class="mute">Impossible de charger les cartes. Ce jeu a besoin d’une connexion internet et n’est pas disponible dans l’aperçu Claude : utilise la version hébergée.</p></div><button class="btn alt" id="bk">Retour</button>`;
   $("bk").onclick=()=>menu(S.sec||"m");return;
  }
 }
 S.gid=(S.gid||0)+1;
 S.lv=lv;S.qs=build(seed,lv);S.i=0;S.score=0;
 showQ();
}
function runTimer(){clearInterval(S.t);S.t=setInterval(()=>{S.left=Math.max(0,S.left-.1);const b=$("tm");if(b)b.style.width=(S.left/LV[S.lv].time*100)+"%";const t=$("ts");if(t)t.textContent=Math.ceil(S.left)+" s";if(S.left<=0)answer(null)},100)}
function showQ(){S.locked=false;S.pick=null;S.quit=false;S.hints=0;S.view="play";S.left=LV[S.lv].time;play();runTimer()}
function askQuit(){if(S.locked)return;S.quit=true;clearInterval(S.t);play()}
function resumeGame(){S.quit=false;play();if(!S.locked)runTimer()}
function quitGame(){S.gid=(S.gid||0)+1;clearInterval(S.t);S.quit=false;if(S.sec)menu(S.sec);else{S.view="home";home()}}
function play(){
 const q=S.qs[S.i];
 app.innerHTML=`<div class="top"><span>Question ${S.i+1}/${S.qs.length}</span><span>${LV[S.lv].n} · <b>${S.score}</b> pts</span></div>
 <div class="bar"><i id="tm" style="width:${S.left/LV[S.lv].time*100}%"></i></div>
 <div class="card flag" style="margin-top:14px">${S.mode==="pf"||S.mode==="cp"||S.mode==="cm"?`<div style="font:800 2rem 'Inter',system-ui,sans-serif;padding:14px 0">${esc(S.mode==="cp"?q.a.k:q.a.n)}</div>`:flag(q.a.c)}${S.mode==="cap"?`<div style="font:800 1.5rem 'Inter',system-ui,sans-serif;margin-top:6px">${esc(q.a.n)}</div>`:""}</div>
 <div class="top"><span class="mute">${{flag:"À quel pays appartient ce drapeau ?",cap:"Quelle est sa capitale ?",pf:"Quel est son drapeau ?",cp:"De quel pays est-ce la capitale ?",cm:"Quelle est la carte de ce pays ?"}[S.mode]}</span><span id="ts" class="mute">${Math.ceil(S.left)} s</span></div>
 <div class="opts">${q.o.map((o,k)=>{let c="";if(S.locked){if(o===q.a)c="ok";else if(k===S.pick)c="no"}return `<button class="opt ${c} ${S.mode==="pf"?"fl":S.mode==="cm"?"mp":""}" data-k="${k}">${S.mode==="cm"?mapSvg(o,S.lv<=2,true):S.mode==="pf"?flag(o.c):S.mode==="cp"?`<span style="display:block;font-size:2rem;line-height:1.3;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">${flag(o.c)}</span>${esc(o.n)}`:esc(S.mode==="cap"?o.k:o.n)}</button>`}).join("")}</div>
 <button class="btn alt" id="qt" style="margin-top:14px" ${S.locked?"disabled":""}>Quitter la partie</button>
 ${S.quit?`<div class="ov"><div class="card"><b>Quitter la partie ?</b><p class="mute">Ta progression sera perdue et ce score ne sera pas enregistré.</p><button class="btn" id="qc">Continuer</button><button class="btn alt" id="qy">Quitter</button></div></div>`:""}`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
 $("qt").onclick=askQuit;
 if(S.quit){$("qc").onclick=resumeGame;$("qy").onclick=quitGame}
}
function answer(k){
 if(S.locked)return;S.locked=true;clearInterval(S.t);S.pick=k;
 const q=S.qs[S.i];
 if(k!==null&&q.o[k]===q.a)S.score+=Math.round((100+50*S.left/LV[S.lv].time)*LV[S.lv].coef*(1-.2*(S.mode==="map"?S.hints||0:0)));
 play();
 const g=S.gid||0;setTimeout(()=>{if(g!==(S.gid||0)||S.view!=="play")return;S.i++;if(S.i>=S.qs.length)finish();else showQ()},1200);
}
const isRec=()=>S.uid?!!(S.res&&S.res.rec):!!S.sessRec;
function confetti(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const cols=["#2563eb","#f59e0b","#10b981","#ef4444","#7c3aed","#ec4899"],box=document.createElement("div");
 box.className="fx";
 for(let i=0;i<46;i++){const p=document.createElement("i");p.style.cssText=`left:${Math.random()*100}%;background:${cols[i%6]};width:${6+Math.random()*6}px;height:${10+Math.random()*8}px;animation-delay:${Math.random()*.5}s;animation-duration:${1.8+Math.random()*1.4}s;--dx:${(Math.random()-.5)*160}px`;box.appendChild(p)}
 document.body.appendChild(box);setTimeout(()=>box.remove(),3600);
}
async function finish(){S.fx=0;const sb=S.sb=S.sb||{},pv=sb[SK()]||0;S.sessRec=pv>0&&S.score>pv;if(S.score>pv)sb[SK()]=S.score;S.view="end";S.res=null;end();S.res=await save();if(S.view==="end")end()}
function end(){
 const m=S.res&&S.res.best!==undefined?`Meilleur score : ${fmt(S.res.best)} pts`:S.res==="err"?"Enregistrement impossible.":S.uid?"Enregistrement…":"Connecte-toi pour enregistrer tes scores.";
 app.innerHTML=`<h1>Terminé<span>.</span></h1><p class="sub">${KL(SK())} · ${LV[S.lv].n}</p>
 <div class="card">${isRec()?`<div class="badge">Nouveau meilleur score</div>`:""}<div class="big ${isRec()?"pop":""}">${S.score}</div><p class="mute">points sur ${(150*S.qs.length*LV[S.lv].coef).toLocaleString("fr-FR")} possibles</p><p class="mute">${m}</p></div>
 <button class="btn" id="again">Rejouer</button><button class="btn alt" id="rk">Voir le classement</button><button class="btn alt" id="hm">Accueil</button>`;
 if(isRec()&&!S.fx){S.fx=1;confetti()}
 $("again").onclick=()=>start(Date.now()%2147483647,S.lv);
 $("rk").onclick=rank;$("hm").onclick=()=>{S.view="home";home()};
}
boot();
</script></body></html>
